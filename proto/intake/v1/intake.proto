syntax = "proto3";

package intake.v1;

// 没有 intake 角色的节点（router、alert 等）→ intake 节点的内部写入 RPC。
// 客户端走 HTTP 或 OTLP gRPC，接收请求的节点按 (org, stream) 一致性哈希转发到对应 intake。
service IntakeService {
  rpc Push(PushRequest) returns (PushResponse);
}

enum StreamType {
  STREAM_TYPE_UNSPECIFIED = 0;
  STREAM_TYPE_LOGS = 1;
  STREAM_TYPE_METRICS = 2;
  STREAM_TYPE_TRACES = 3;
  STREAM_TYPE_PROFILES = 4;
}

// 镜像 domain::intake::IntakeBatch 的字段集。
message PushRequest {
  string batch_id = 1;
  string org_id = 2;
  string stream = 3;
  StreamType stream_type = 4;
  // 客户端原始 NDJSON / JSON array / OTLP payload 的 bytes，由 intake 解析
  bytes payload = 5;
  int64 received_at_micros = 6;
  // 数据流类型的外部名称（"logs"、"extend" 或扩展类型 ID）。非空时优先于 stream_type，
  // 用于 stream_type 枚举无法表示的类型。
  string stream_type_name = 7;
}

message PushResponse {
  uint32 accepted = 1;
  uint32 rejected = 2;
  repeated IntakeError errors = 3;
}

message IntakeError {
  uint32 index = 1;
  string reason = 2;
}

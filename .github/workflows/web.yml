name: web

on:
  push:
    paths:
      - 'web/**'
      - 'package.json'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/web.yml'
  pull_request:
    paths:
      - 'web/**'
      - 'package.json'
      - 'pnpm-workspace.yaml'
  workflow_dispatch:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm -C web install --frozen-lockfile
      - run: pnpm -C web typecheck
      - run: pnpm -C web lint
      - run: pnpm -C web a11y:contrast
      - run: pnpm -C web test:run
      - run: pnpm -C web build
      - name: keymap drift check
        run: |
          pnpm -C web dump:keymap
          if ! git diff --exit-code docs/web/keyboard.md; then
            echo "::error::docs/web/keyboard.md is out of sync with web/src/keyboard/bindings.ts. Run 'pnpm -C web dump:keymap' and commit."
            exit 1
          fi

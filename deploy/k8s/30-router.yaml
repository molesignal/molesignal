apiVersion: apps/v1
kind: Deployment
metadata:
  name: router
  namespace: molesignal
spec:
  replicas: 2
  selector:
    matchLabels: { app: molesignal, role: router }
  template:
    metadata:
      labels: { app: molesignal, role: router }
    spec:
      containers:
        - name: molesignal
          image: molesignal:dev
          imagePullPolicy: IfNotPresent
          args: ["--config", "/app/conf/config.toml"]
          env:
            - name: RELEASE_CHANNEL
              valueFrom: { configMapKeyRef: { name: molesignal-config, key: release_channel } }
            - name: MS_NODE_ROLES
              value: '["router"]'
            - name: MS_AUTH_JWT_SECRET_OVERRIDE
              valueFrom: { secretKeyRef: { name: molesignal-secret, key: jwt_secret_override, optional: true } }
            # 所有 role 启动时都会对对象存储做一次读写自检，router 也需要凭据。
            - name: MS_OBJECT_STORE_ACCESS_KEY
              valueFrom: { secretKeyRef: { name: molesignal-secret, key: object_store_access_key } }
            - name: MS_OBJECT_STORE_SECRET_KEY
              valueFrom: { secretKeyRef: { name: molesignal-secret, key: object_store_secret_key } }
            - name: MS_CIPHER_KEY
              valueFrom: { secretKeyRef: { name: molesignal-secret, key: cipher_key } }
            - name: MS_SELF_TELEMETRY_CLUSTER_TOKEN
              valueFrom: { secretKeyRef: { name: molesignal-secret, key: self_telemetry_cluster_token } }
          # router 提供完整 HTTP API 与 Web UI，另接收 OTLP gRPC；写入转发给 intake，查询交给 querier。
          ports:
            - { name: http, containerPort: 5080 }
            - { name: otlp-grpc, containerPort: 4317 }
          volumeMounts:
            - { name: cfg, mountPath: /app/conf }
          readinessProbe:
            httpGet: { path: /api/v1/healthz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: cfg
          configMap: { name: molesignal-config }
---
apiVersion: v1
kind: Service
metadata:
  name: router
  namespace: molesignal
spec:
  selector: { app: molesignal, role: router }
  ports:
    - { name: http, port: 5080, targetPort: http }
    - { name: otlp-grpc, port: 4317, targetPort: otlp-grpc }
  type: ClusterIP

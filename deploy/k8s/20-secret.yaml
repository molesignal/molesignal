apiVersion: v1
kind: Secret
metadata:
  name: molesignal-secret
  namespace: molesignal
type: Opaque
stringData:
  # 生产部署前替换，建议：
  #   kubectl create secret generic molesignal-secret \
  #     --from-literal=cipher_key="$(openssl rand -base64 32)" \
  #     --from-literal=object_store_access_key="$(aws-iam-user-access-key)" \
  #     --from-literal=object_store_secret_key="$(aws-iam-user-secret-key)"
  #
  # 注意：JWT signing secret 由进程**首启动自动生成 + DB 持久化**（auth-hardening），
  #       无需在此预置。仅在多集群强制共享 secret 时设 MS_AUTH_JWT_SECRET_OVERRIDE。

  # S3 / S3-compatible 凭据，分别注入 MS_STORE_OBJECT_ACCESS_KEY /
  # MS_STORE_OBJECT_SECRET_KEY；必须成对配置。
  object_store_access_key: minioadmin
  object_store_secret_key: minioadmin

  # 字段级加密的 cipher root key（envelope KEK，32 字节 base64）。
  # 缺失付费版退到 dev fallback（全零）。
  cipher_key: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=

  # 可选：JWT secret 显式锁定（CI / multi-region 同步场景）。
  # 留空 = 让 DB 自动 bootstrap（推荐）。
  jwt_secret_override: ""
---
# Ed25519 签名 license 文件，挂到容器 /etc/molesignal/license.json
apiVersion: v1
kind: Secret
metadata:
  name: molesignal-license
  namespace: molesignal
type: Opaque
stringData:
  license.json: |
    {
      "payload_b64": "",
      "signature_b64": ""
    }

# alert pod 同时承担 scheduled_reports tick（change `scheduled-reports-headless`）。
#  build 启用 headless renderer 时本镜像必须含 chromium —— 仓库 Dockerfile
# 已 `apt-get install chromium`，并设 `CHROME_PATH=/usr/bin/chromium`。
# 自定义 image 的 ops 务必同步装包，否则 png/pdf 报告退化到 SVG fallback。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alert
  namespace: molesignal
spec:
  replicas: 1  # 可加副本：多个 alert 节点按规则、报告、pipeline、日志定时巡检分担后台工作，节点故障后由其余节点接管
  strategy: { type: RollingUpdate }  # 新节点预热一个存活窗口后才接管工作，更新期间新旧节点重叠不会重复评估 / 派发
  selector:
    matchLabels: { app: molesignal, role: alert }
  template:
    metadata:
      labels: { app: molesignal, role: alert }
      annotations:
        # 自定义镜像未装 chromium 时，把 enabled 设 false 走 SVG fallback。
        molesignal.com/scheduled-reports-renderer: "requires-chromium"
    spec:
      containers:
        - name: molesignal
          image: molesignal:dev
          imagePullPolicy: IfNotPresent
          args: ["--config", "/app/conf/config.toml"]
          env:
            - name: RELEASE_CHANNEL
              valueFrom: { configMapKeyRef: { name: molesignal-config, key: release_channel } }
            - name: MS_NODE_ROLES
              value: '["alert"]'
            - name: POD_IP
              valueFrom: { fieldRef: { fieldPath: status.podIP } }
            - name: MS_CLUSTER_ADVERTISE_ADDR
              value: "$(POD_IP):5082"
            # JWT signing secret 默认 DB 自动 bootstrap；如需多副本锁定同一 secret，
            # 设 jwt_secret_override 字段（kubectl edit secret/molesignal-secret）。
            - name: MS_AUTH_JWT_SECRET_OVERRIDE
              valueFrom: { secretKeyRef: { name: molesignal-secret, key: jwt_secret_override, optional: true } }
            - name: MS_OBJECT_STORE_ACCESS_KEY
              valueFrom: { secretKeyRef: { name: molesignal-secret, key: object_store_access_key } }
            - name: MS_OBJECT_STORE_SECRET_KEY
              valueFrom: { secretKeyRef: { name: molesignal-secret, key: object_store_secret_key } }
            - name: MS_CIPHER_KEY
              valueFrom: { secretKeyRef: { name: molesignal-secret, key: cipher_key } }
            - name: MS_SELF_TELEMETRY_CLUSTER_TOKEN
              valueFrom: { secretKeyRef: { name: molesignal-secret, key: self_telemetry_cluster_token } }
          # 5080 是运维 HTTP（探活、就绪、指标）；5084 与 5085 是 Probe Agent 的注册端口与控制端口。
          ports:
            - { name: http, containerPort: 5080 }
            - { name: probe-register, containerPort: 5084 }
            - { name: probe-control, containerPort: 5085 }
          readinessProbe:
            httpGet: { path: /api/v1/readyz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - { name: cfg, mountPath: /app/conf }
      volumes:
        - name: cfg
          configMap: { name: molesignal-config }
---
apiVersion: v1
kind: Service
metadata:
  name: alert
  namespace: molesignal
spec:
  selector: { app: molesignal, role: alert }
  ports:
    - { name: http, port: 5080, targetPort: http }
    - { name: probe-register, port: 5084, targetPort: probe-register }
    - { name: probe-control, port: 5085, targetPort: probe-control }
  type: ClusterIP

# intake 是无状态的：写入确认前 WAL 已写进对象存储，节点及本地盘丢失后由其余 intake 节点接管
# 未刷写的数据（[wal].lease_secs 之后）。不需要持久卷，可以像其它 Deployment 一样随意替换。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: intake
  namespace: molesignal
spec:
  replicas: 2
  # 先起新 Pod 再停旧 Pod；旧 Pod 收到 SIGTERM 后刷完缓冲并释放 WAL，剩余部分立即由其它节点接管。
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  selector:
    matchLabels: { app: molesignal, role: intake }
  template:
    metadata:
      labels: { app: molesignal, role: intake }
    spec:
      # 大于 [node].drain_timeout_secs（默认 30），留出刷写与释放 WAL 的时间。
      terminationGracePeriodSeconds: 45
      containers:
        - name: molesignal
          image: molesignal:dev
          imagePullPolicy: IfNotPresent
          args: ["--config", "/app/conf/config.toml"]
          env:
            - name: MS_NODE_ROLES
              value: '["intake"]'
            - name: POD_IP
              valueFrom: { fieldRef: { fieldPath: status.podIP } }
            - name: MS_CLUSTER_ADVERTISE_ADDR
              value: "$(POD_IP):5082"
            # JWT signing secret 默认 DB 自动 bootstrap；如需多副本锁定同一 secret，
            # 设 jwt_secret_override 字段（kubectl edit secret/molesignal-secret）。
            - name: MS_AUTH_JWT_SECRET_OVERRIDE
              valueFrom: { secretKeyRef: { name: molesignal-secret, key: jwt_secret_override, optional: true } }
            - name: MS_OBJECT_STORE_ACCESS_KEY
              valueFrom: { secretKeyRef: { name: molesignal-secret, key: object_store_access_key } }
            - name: MS_OBJECT_STORE_SECRET_KEY
              valueFrom: { secretKeyRef: { name: molesignal-secret, key: object_store_secret_key } }
            - name: MS_CIPHER_KEY
              valueFrom: { secretKeyRef: { name: molesignal-secret, key: cipher_key } }
            - name: MS_SELF_TELEMETRY_CLUSTER_TOKEN
              valueFrom: { secretKeyRef: { name: molesignal-secret, key: self_telemetry_cluster_token } }
          # 5080 是运维 HTTP（探活、就绪、指标），5082 是集群内部 gRPC，4317 是对外 OTLP gRPC。
          ports:
            - { name: http, containerPort: 5080 }
            - { name: grpc, containerPort: 5082 }
            - { name: otlp-grpc, containerPort: 4317 }
          # readyz 通过即表示可以接收写入；启动时不需要重放 WAL。
          readinessProbe:
            httpGet: { path: /api/v1/readyz, port: http }
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 12
          volumeMounts:
            - { name: cfg, mountPath: /app/conf }
      volumes:
        - name: cfg
          configMap: { name: molesignal-config }
---
apiVersion: v1
kind: Service
metadata:
  name: intake
  namespace: molesignal
spec:
  clusterIP: None
  selector: { app: molesignal, role: intake }
  ports:
    - { name: http, port: 5080, targetPort: http }
    - { name: grpc, port: 5082, targetPort: grpc }
    - { name: otlp-grpc, port: 4317, targetPort: otlp-grpc }

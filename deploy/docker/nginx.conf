# molesignal-web — SPA on /, reverse proxy on /api.
#
# This file is mounted as /etc/nginx/templates/molesignal-web.conf.template
# by Dockerfile.web. The official nginx:alpine entrypoint runs envsubst on
# templates, expanding $MS_BACKEND (default molesignal:5080).
#
# Cache strategy:
#   - index.html (and any un-hashed HTML) → Cache-Control: no-store
#   - everything else under /assets/      → immutable (1y) because Vite already
#                                           cache-busts via filename hashes.
#
# Streaming:
#   - /api/v1/query/stream uses chunked NDJSON; disable proxy buffering so the
#     log live tail sees row-level latency.

server {
    listen       8080;
    server_name  _;
    root         /usr/share/nginx/html;

    # liveness for kubelet / docker HEALTHCHECK
    location = /healthz {
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # SPA — no-store on HTML, immutable on hashed assets.
    location = /index.html {
        add_header Cache-Control "no-store, max-age=0";
        try_files $uri =404;
    }
    location ~* \.(?:js|mjs|css|woff2|svg|png|jpg|webp|ico)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
    location / {
        add_header Cache-Control "no-store, max-age=0";
        try_files $uri /index.html;
    }

    # Reverse proxy — long-running streaming responses must not buffer.
    location ~ ^/api/v1/query/stream {
        proxy_pass         http://${MS_BACKEND};
        proxy_http_version 1.1;
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        chunked_transfer_encoding on;
    }

    # All other API requests.
    location /api/ {
        proxy_pass         http://${MS_BACKEND};
        proxy_http_version 1.1;
        proxy_read_timeout 60s;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}

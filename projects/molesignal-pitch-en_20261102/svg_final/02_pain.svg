<g id="heading" data-pptx-bounds="56 44 1168 115"><text x="56" y="65" font-size="18" fill="#007E87">01 / CUSTOMER PAIN</text><text x="56" y="126" font-size="44" fill="#102C44" font-weight="bold">More tools. Still too much operational work.</text></g>
<g id="context" data-pptx-bounds="56 200 350 330"><text x="56" y="238" font-size="30" fill="#102C44" font-weight="bold">Fragmented context</text><text font-size="24" fill="#173247" x="56" y="296">Logs, metrics, traces and</text><text font-size="24" fill="#173247" x="56" y="332">incidents span workflows.</text><text font-size="24" fill="#173247" x="56" y="368">Engineers repeatedly align</text><text font-size="24" fill="#173247" x="56" y="404">time, services, ownership</text><text font-size="24" fill="#173247" x="56" y="440">and response progress.</text><text x="56" y="518" font-size="20" fill="#007E87">Cost: investigation and handoffs</text></g>
<g id="cost" data-pptx-bounds="464 200 350 330"><text x="464" y="238" font-size="30" fill="#102C44" font-weight="bold">Complex total cost</text><text font-size="24" fill="#173247" x="464" y="296">SaaS bills grow across</text><text font-size="24" fill="#173247" x="464" y="332">multiple usage dimensions.</text><text font-size="24" fill="#173247" x="464" y="368">Self-hosting shifts work to</text><text font-size="24" fill="#173247" x="464" y="404">component operations,</text><text font-size="24" fill="#173247" x="464" y="440">storage and engineering.</text><text x="464" y="518" font-size="20" fill="#007E87">Cost: budget and platform effort</text></g>
<g id="control" data-pptx-bounds="872 200 352 330"><text x="872" y="238" font-size="30" fill="#102C44" font-weight="bold">More control needs</text><text font-size="24" fill="#173247" x="872" y="296">Telemetry can be sensitive.</text><text font-size="24" fill="#173247" x="872" y="332">AI adds model access,</text><text font-size="24" fill="#173247" x="872" y="368">tool permissions and</text><text font-size="24" fill="#173247" x="872" y="404">approvals to the same</text><text font-size="24" fill="#173247" x="872" y="440">governance boundary.</text><text x="872" y="518" font-size="20" fill="#007E87">Cost: governance and deployment</text></g>
<g id="thesis" data-pptx-bounds="56 561 1168 65"><rect x="56" y="561" width="1168" height="65" fill="#E8F2F4" /><text x="80" y="602" font-size="24" fill="#102C44">Our hypothesis: teams want signals, response and control in one product.</text></g>
<text id="footer" data-pptx-role="footer" x="56" y="682" font-size="16" fill="#53677B">Target-customer hypotheses, pending interviews and pilots; not claims about every tool or team.</text><text id="page" data-pptx-role="page-number" x="1224" y="682" text-anchor="end" font-size="16" fill="#53677B">02 / 14</text>
</svg>
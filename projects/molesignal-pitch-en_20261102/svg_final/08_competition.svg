<g id="datadog" data-pptx-bounds="56 200 350 340"><text x="56" y="238" font-size="30" fill="#102C44" font-weight="bold">Datadog</text><text font-size="24" fill="#173247" x="56" y="290">Broad SaaS platform for</text><text font-size="24" fill="#173247" x="56" y="326">observability, response and AI.</text><text font-size="24" fill="#173247" x="56" y="378">Multiple product and</text><text font-size="24" fill="#173247" x="56" y="414">usage-based pricing units.</text><text font-size="20" fill="#53677B" x="56" y="476">Fits teams prioritizing breadth</text><text font-size="20" fill="#53677B" x="56" y="508">and accepting that pricing model.</text></g>
<g id="grafana" data-pptx-bounds="464 200 374 340"><text x="464" y="238" font-size="30" fill="#102C44" font-weight="bold">Grafana</text><text font-size="24" fill="#173247" x="464" y="290">Loki, Mimir and Tempo;</text><text font-size="24" fill="#173247" x="464" y="326">Cloud IRM with AI investigation.</text><text font-size="24" fill="#173247" x="464" y="378">Composable projects and</text><text font-size="24" fill="#173247" x="464" y="414">managed cloud options.</text><text font-size="20" fill="#53677B" x="464" y="476">Fits teams valuing flexibility</text><text font-size="20" fill="#53677B" x="464" y="508">and existing ecosystem investment.</text></g>
<g id="openobserve" data-pptx-bounds="872 200 352 340"><text x="872" y="238" font-size="30" fill="#102C44" font-weight="bold">OpenObserve</text><text font-size="24" fill="#173247" x="872" y="290">Unified telemetry, self-hosting</text><text font-size="24" fill="#173247" x="872" y="326">and Cloud; incidents and AI.</text><text font-size="24" fill="#173247" x="872" y="378">AGPL core; Cloud primarily</text><text font-size="24" fill="#173247" x="872" y="414">priced per GB ingested.</text><text font-size="20" fill="#53677B" x="872" y="476">Significant technical overlap;</text><text font-size="20" fill="#53677B" x="872" y="508">workflow fit must earn the choice.</text></g>

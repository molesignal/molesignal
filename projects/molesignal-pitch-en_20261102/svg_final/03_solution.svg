<g id="heading" data-pptx-bounds="56 44 1168 115"><text x="56" y="65" font-size="18" fill="#007E87">02 / PRODUCT APPROACH</text><text x="56" y="126" font-size="44" fill="#102C44" font-weight="bold">Investigate and respond in one environment</text></g>
<g id="telemetry" data-pptx-bounds="56 202 550 150"><text x="56" y="238" font-size="30" fill="#1766D3" font-weight="bold">Unified telemetry</text><text font-size="24" fill="#173247" x="56" y="288">Logs, metrics, traces and cross-signal context.</text><text font-size="24" fill="#173247" x="56" y="324">SQL / PromQL for investigation.</text></g>
<g id="response" data-pptx-bounds="680 202 544 150"><text x="680" y="238" font-size="30" fill="#1766D3" font-weight="bold">Incident response</text><text font-size="24" fill="#173247" x="680" y="288">Alerts, on-call, escalation and status updates.</text><text font-size="24" fill="#173247" x="680" y="324">Carry findings into response and review.</text></g>
<g id="agent" data-pptx-bounds="56 390 550 155"><text x="56" y="426" font-size="30" fill="#007E87" font-weight="bold">Mole Agent</text><text font-size="24" fill="#173247" x="56" y="476">Gather evidence within platform permissions.</text><text font-size="24" fill="#173247" x="56" y="512">Choose models; approve high-risk actions.</text></g>
<g id="deployment" data-pptx-bounds="680 390 544 155"><text x="680" y="426" font-size="30" fill="#007E87" font-weight="bold">Self-managed deployment</text><text font-size="24" fill="#173247" x="680" y="476">Rust binary, PostgreSQL metadata,</text><text font-size="24" fill="#173247" x="680" y="512">local or object storage; standard protocols.</text></g>
<g id="entry" data-pptx-bounds="56 584 1168 52"><text x="56" y="618" font-size="24" fill="#102C44">Start with existing alerts. Migrate telemetry when the team is ready.</text></g>

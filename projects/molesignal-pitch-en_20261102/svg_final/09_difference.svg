<g id="heading" data-pptx-bounds="56 44 1168 115"><text x="56" y="65" font-size="18" fill="#007E87">04 / WHY MOLESIGNAL</text><text x="56" y="126" font-size="44" fill="#102C44" font-weight="bold">For teams prioritizing control and response</text></g>
<g id="control" data-pptx-bounds="56 198 550 164"><text x="56" y="234" font-size="30" fill="#007E87" font-weight="bold">Openness and control</text><text font-size="24" fill="#173247" x="56" y="286">Apache 2.0, self-hosted data and model choice.</text><text font-size="24" fill="#173247" x="56" y="322">A fit when deployment control is essential.</text></g>
<g id="fit" data-pptx-bounds="680 198 544 164"><text x="680" y="234" font-size="30" fill="#1766D3" font-weight="bold">One response experience</text><text font-size="24" fill="#173247" x="680" y="286">Investigation, on-call, status and approvals.</text><text font-size="24" fill="#173247" x="680" y="322">Aim to reduce assembly and handoff effort.</text></g>
<g id="adoption" data-pptx-bounds="56 390 550 164"><text x="56" y="426" font-size="30" fill="#1766D3" font-weight="bold">Incremental adoption</text><text font-size="24" fill="#173247" x="56" y="478">Accept existing alerts and standard telemetry.</text><text font-size="24" fill="#173247" x="56" y="514">Test one use case before broader migration.</text></g>
<g id="proof" data-pptx-bounds="680 390 544 164"><text x="680" y="426" font-size="30" fill="#007E87" font-weight="bold">Advantages to prove</text><text font-size="24" fill="#173247" x="680" y="478">Prove setup, response efficiency and retention.</text><text font-size="24" fill="#173247" x="680" y="514">TCO and performance gains remain unproven.</text></g>

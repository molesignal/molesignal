<g id="datadog" data-pptx-bounds="56 200 350 340"><text x="56" y="238" font-size="30" fill="#102C44" font-weight="bold">Datadog</text><text x="56" y="290" font-size="24" fill="#173247"><tspan x="56">Broad SaaS platform for</tspan><tspan x="56" dy="36">observability, response and AI.</tspan><tspan x="56" dy="52">Multiple product and</tspan><tspan x="56" dy="36">usage-based pricing units.</tspan></text><text x="56" y="476" font-size="20" fill="#53677B"><tspan x="56">Fits teams prioritizing breadth</tspan><tspan x="56" dy="32">and accepting that pricing model.</tspan></text></g>

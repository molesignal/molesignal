<g id="heading" data-pptx-bounds="56 44 1168 115"><text x="56" y="65" font-size="18" fill="#007E87">04 / WHY MOLESIGNAL</text><text x="56" y="126" font-size="44" fill="#102C44" font-weight="bold">For teams prioritizing control and response</text></g>
<g id="control" data-pptx-bounds="56 198 550 164"><text x="56" y="234" font-size="30" fill="#007E87" font-weight="bold">Openness and control</text><text x="56" y="286" font-size="24" fill="#173247"><tspan x="56">Apache 2.0, self-hosted data and model choice.</tspan><tspan x="56" dy="36">A fit when deployment control is essential.</tspan></text></g>
<g id="fit" data-pptx-bounds="680 198 544 164"><text x="680" y="234" font-size="30" fill="#1766D3" font-weight="bold">One response experience</text><text x="680" y="286" font-size="24" fill="#173247"><tspan x="680">Investigation, on-call, status and approvals.</tspan><tspan x="680" dy="36">Aim to reduce assembly and handoff effort.</tspan></text></g>
<g id="adoption" data-pptx-bounds="56 390 550 164"><text x="56" y="426" font-size="30" fill="#1766D3" font-weight="bold">Incremental adoption</text><text x="56" y="478" font-size="24" fill="#173247"><tspan x="56">Accept existing alerts and standard telemetry.</tspan><tspan x="56" dy="36">Test one use case before broader migration.</tspan></text></g>
<g id="proof" data-pptx-bounds="680 390 544 164"><text x="680" y="426" font-size="30" fill="#007E87" font-weight="bold">Advantages to prove</text><text x="680" y="478" font-size="24" fill="#173247"><tspan x="680">Prove setup, response efficiency and retention.</tspan><tspan x="680" dy="36">TCO and performance gains remain unproven.</tspan></text></g>

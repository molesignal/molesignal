<g id="heading" data-pptx-bounds="56 44 1168 115"><text x="56" y="65" font-size="18" fill="#007E87">05 / 商业模式</text><text x="56" y="126" font-size="44" fill="#102C44" font-weight="bold">开源自部署获采用，Cloud 订阅变现</text></g>
<g id="oss" data-pptx-bounds="56 202 540 330"><text x="56" y="240" font-size="30" fill="#102C44" font-weight="bold">开源自部署</text><text x="56" y="304" font-size="44" fill="#007E87" font-weight="bold">免费 · Apache 2.0</text><text x="56" y="370" font-size="24" fill="#173247"><tspan x="56">客户管理自己的基础设施与数据。</tspan><tspan x="56" dy="40">通过源码、文档和部署体验建立信任。</tspan><tspan x="56" dy="40">验证真实需求，形成可持续的产品反馈。</tspan></text></g>
<g id="cloud" data-pptx-bounds="680 202 544 330"><text x="680" y="240" font-size="30" fill="#102C44" font-weight="bold">Cloud 订阅</text><text x="680" y="304" font-size="44" fill="#1766D3" font-weight="bold">筹备中 · 定价待验证</text><text x="680" y="370" font-size="24" fill="#173247"><tspan x="680">拟采用订阅含额度，超额按用量计费。</tspan><tspan x="680" dy="40">付费价值：托管、升级、备份与支持。</tspan><tspan x="680" dy="40">先验证付费意愿，再确定套餐与额度。</tspan></text></g>
<g id="economics" data-pptx-bounds="56 563 1168 72"><rect x="56" y="563" width="1168" height="72" fill="#E8F2F4"/><text x="80" y="608" font-size="24" fill="#102C44">重点测量：试用转化、客户留存，以及存储、查询、模型和支持的单位成本。</text></g>
<text id="footer" data-pptx-role="footer" x="56" y="682" font-size="16" fill="#53677B">Cloud 尚未上线；订阅结构为规划，不是已发布价格、收入或毛利承诺。</text><text id="page" data-pptx-role="page-number" x="1224" y="682" text-anchor="end" font-size="16" fill="#53677B">10 / 14</text>
</svg>

<g id="datadog" data-pptx-bounds="56 200 350 337"><text x="56" y="238" font-size="30" fill="#102C44" font-weight="bold">Datadog</text><text x="56" y="290" font-size="24" fill="#173247"><tspan x="56">可观测、事件响应与 AI</tspan><tspan x="56" dy="36">覆盖完整的 SaaS 平台。</tspan><tspan x="56" dy="52">按产品与多种用量计费。</tspan></text><text x="56" y="466" font-size="20" fill="#53677B"><tspan x="56">适合优先选择成熟产品广度、</tspan><tspan x="56" dy="32">接受相应计费模式的团队。</tspan></text></g>
<g id="grafana" data-pptx-bounds="464 200 350 337"><text x="464" y="238" font-size="30" fill="#102C44" font-weight="bold">Grafana</text><text x="464" y="290" font-size="24" fill="#173247"><tspan x="464">Loki / Mimir / Tempo 生态，</tspan><tspan x="464" dy="36">Cloud IRM 与 AI 调查。</tspan><tspan x="464" dy="52">支持组件化选择与托管。</tspan></text><text x="464" y="466" font-size="20" fill="#53677B"><tspan x="464">适合看重生态、灵活组合，</tspan><tspan x="464" dy="32">或已有 Grafana 投入的团队。</tspan></text></g>
<g id="openobserve" data-pptx-bounds="872 200 352 337"><text x="872" y="238" font-size="30" fill="#102C44" font-weight="bold">OpenObserve</text><text x="872" y="290" font-size="24" fill="#173247"><tspan x="872">统一遥测、自部署 / Cloud，</tspan><tspan x="872" dy="36">同样包含事件与 AI。</tspan><tspan x="872" dy="52">AGPL 核心；Cloud 按 GB。</tspan></text><text x="872" y="466" font-size="20" fill="#53677B"><tspan x="872">与 MoleSignal 技术重合较多，</tspan><tspan x="872" dy="32">需靠具体场景与体验取胜。</tspan></text></g>

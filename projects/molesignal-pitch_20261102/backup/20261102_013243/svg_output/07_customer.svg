<g id="heading" data-pptx-bounds="56 44 1168 115"><text x="56" y="65" font-size="18" fill="#007E87">03 / 目标客户</text><text x="56" y="126" font-size="44" fill="#102C44" font-weight="bold">先服务平台人力有限的工程团队</text></g>
<g id="who" data-pptx-bounds="56 200 520 360"><text x="56" y="236" font-size="30" fill="#1766D3" font-weight="bold">谁使用</text><text x="56" y="284" font-size="24" fill="#173247">SRE、平台工程师、后端与值班人员</text><text x="56" y="378" font-size="30" fill="#007E87" font-weight="bold">谁付费</text><text x="56" y="426" font-size="24" fill="#173247"><tspan x="56">CTO、工程负责人、平台预算负责人</tspan><tspan x="56" dy="36">购买托管能力、运维支持与时间节省</tspan></text></g>
<g id="wedge" data-pptx-bounds="672 200 552 360"><text x="672" y="236" font-size="30" fill="#102C44" font-weight="bold">初始客户画像假设</text><text x="672" y="292" font-size="24" fill="#173247"><tspan x="672">已有 Prometheus / Grafana 或云监控。</tspan><tspan x="672" dy="44">业务需要值班，却缺少专职平台团队。</tspan><tspan x="672" dy="44">希望减少工具维护，并保留数据控制权。</tspan><tspan x="672" dy="44">优先验证 SaaS 与互联网服务团队。</tspan></text></g>
<g id="entry" data-pptx-bounds="56 563 1168 72"><rect x="56" y="563" width="1168" height="72" fill="#E8F2F4"/><text x="80" y="608" font-size="24" fill="#102C44">获客起点：开源试用、创始人直访、设计伙伴；先验证告警与响应场景。</text></g>
<text id="footer" data-pptx-role="footer" x="56" y="682" font-size="16" fill="#53677B">客户画像与获客方式均为待验证假设；设计伙伴获取路径尚待验证。</text><text id="page" data-pptx-role="page-number" x="1224" y="682" text-anchor="end" font-size="16" fill="#53677B">07 / 14</text>

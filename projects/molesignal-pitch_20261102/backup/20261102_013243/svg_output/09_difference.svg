<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" data-pptx-page-role="content" font-family="Microsoft YaHei, Arial">
<rect id="bg" data-pptx-role="background" width="1280" height="720" fill="#F7F9FC"/>
<g id="heading" data-pptx-bounds="56 44 1168 115"><text x="56" y="65" font-size="18" fill="#007E87">04 / 差异化与选择条件</text><text x="56" y="126" font-size="44" fill="#102C44" font-weight="bold">为重视控制权与响应流程的团队而做</text></g>
<g id="control" data-pptx-bounds="56 198 550 164"><text x="56" y="234" font-size="30" fill="#007E87" font-weight="bold">开放与控制</text><text x="56" y="286" font-size="24" fill="#173247"><tspan x="56">Apache 2.0；数据与模型可留在自有环境。</tspan><tspan x="56" dy="36">适合将自主部署作为核心要求的团队。</tspan></text></g>
<g id="fit" data-pptx-bounds="680 198 544 164"><text x="680" y="234" font-size="30" fill="#1766D3" font-weight="bold">观测与响应一起交付</text><text x="680" y="286" font-size="24" fill="#173247"><tspan x="680">统一调查、值班、状态页与审批体验。</tspan><tspan x="680" dy="36">争取降低组件拼装与流程交接负担。</tspan></text></g>
<g id="adoption" data-pptx-bounds="56 390 550 164"><text x="56" y="426" font-size="30" fill="#1766D3" font-weight="bold">渐进采用</text><text x="56" y="478" font-size="24" fill="#173247"><tspan x="56">接收已有监控告警，兼容标准采集协议。</tspan><tspan x="56" dy="36">从一个响应场景开始验证，不要求全迁。</tspan></text></g>
<g id="proof" data-pptx-bounds="680 390 544 164"><text x="680" y="426" font-size="30" fill="#007E87" font-weight="bold">需要证明的优势</text><text x="680" y="478" font-size="24" fill="#173247"><tspan x="680">部署成功率、响应效率、留存与总成本。</tspan><tspan x="680" dy="36">目前没有客户证据或量化性能优势。</tspan></text></g>
<text id="footer" data-pptx-role="footer" x="56" y="682" font-size="16" fill="#53677B">差异来自面向目标团队的组合与执行；未来壁垒需在真实使用中形成。</text><text id="page" data-pptx-role="page-number" x="1224" y="682" text-anchor="end" font-size="16" fill="#53677B">09 / 14</text>

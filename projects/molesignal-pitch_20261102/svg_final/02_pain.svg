<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" data-pptx-page-role="content" font-family="Microsoft YaHei, Arial">
<rect id="bg" data-pptx-role="background" width="1280" height="720" fill="#F7F9FC" />
<g id="heading" data-pptx-bounds="56 44 1168 115"><text x="56" y="65" font-size="18" fill="#007E87">01 / 客户痛点</text><text x="56" y="126" font-size="44" fill="#102C44" font-weight="bold">工具很多，排障与运维仍然费力</text></g>
<g id="context" data-pptx-bounds="56 200 350 315"><text x="56" y="238" font-size="30" fill="#102C44" font-weight="bold">上下文分散</text><text fill="#173247" font-size="24" x="56" y="296">日志、指标、链路和事件</text><text fill="#173247" font-size="24" x="56" y="332">散落在不同工作流中，</text><text fill="#173247" font-size="24" x="56" y="368">工程师反复对齐时间、</text><text fill="#173247" font-size="24" x="56" y="404">服务、责任人与处理进度。</text><text x="56" y="498" font-size="20" fill="#007E87">代价：调查与交接时间</text></g>
<g id="cost" data-pptx-bounds="464 200 350 315"><text x="464" y="238" font-size="30" fill="#102C44" font-weight="bold">总成本难管理</text><text fill="#173247" font-size="24" x="464" y="296">SaaS 账单随多种用量增长；</text><text fill="#173247" font-size="24" x="464" y="332">自建又需要维护多个组件。</text><text fill="#173247" font-size="24" x="464" y="368">软件、存储与工程师时间</text><text fill="#173247" font-size="24" x="464" y="404">都进入真实成本。</text><text x="464" y="498" font-size="20" fill="#007E87">代价：预算与平台人力</text></g>
<g id="control" data-pptx-bounds="872 200 352 315"><text x="872" y="238" font-size="30" fill="#102C44" font-weight="bold">控制要求增加</text><text fill="#173247" font-size="24" x="872" y="296">日志可能包含敏感数据；</text><text fill="#173247" font-size="24" x="872" y="332">AI 调查又引入模型访问、</text><text fill="#173247" font-size="24" x="872" y="368">工具权限与操作审批，</text><text fill="#173247" font-size="24" x="872" y="404">必须纳入同一治理边界。</text><text x="872" y="498" font-size="20" fill="#007E87">代价：治理与部署复杂度</text></g>
<g id="thesis" data-pptx-bounds="56 561 1168 65"><rect x="56" y="561" width="1168" height="65" fill="#E8F2F4" /><text x="80" y="602" font-size="24" fill="#102C44">切入假设：团队需要把信号、响应流程和控制权收拢到一个产品。</text></g>
<text id="footer" data-pptx-role="footer" x="56" y="682" font-size="16" fill="#53677B">目标客户痛点假设，尚待访谈与试点验证；不代表所有竞品或所有团队。</text><text id="page" data-pptx-role="page-number" x="1224" y="682" text-anchor="end" font-size="16" fill="#53677B">02 / 14</text>
</svg>
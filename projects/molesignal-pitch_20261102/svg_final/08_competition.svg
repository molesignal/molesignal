<g id="datadog" data-pptx-bounds="56 200 350 337"><text x="56" y="238" font-size="30" fill="#102C44" font-weight="bold">Datadog</text><text fill="#173247" font-size="24" x="56" y="290">可观测、事件响应与 AI</text><text fill="#173247" font-size="24" x="56" y="326">覆盖完整的 SaaS 平台。</text><text fill="#173247" font-size="24" x="56" y="378">按产品与多种用量计费。</text><text fill="#53677B" font-size="20" x="56" y="466">适合优先选择成熟产品广度、</text><text fill="#53677B" font-size="20" x="56" y="498">接受相应计费模式的团队。</text></g>

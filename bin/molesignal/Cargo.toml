[features]
default = ["jemalloc", "profiling-pprof", "ws", "js-runtime"]
ws = ["axum/ws"]
enterprise = []
jemalloc = ["dep:tikv-jemallocator", "dep:tikv-jemalloc-ctl"]
profiling-pprof = ["dep:pprof", "dep:pprof_util"]
js-runtime = ["function-runtime/js-runtime", "postgres/js-runtime"]

[dev-dependencies]
criterion = "0.8"
rcgen = "0.14"
testcontainers.workspace = true
testcontainers-modules.workspace = true
tokio-tungstenite = "0.29"
wiremock = "0.6"

[[bench]]
name = "schema_infer"
harness = false

[[bench]]
name = "intake_hotpath"
harness = false

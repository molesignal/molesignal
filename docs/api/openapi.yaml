    post:
      summary: Set the effective default Prompt for its scope and purpose
      description: "An organization Prompt for `system` or `root_cause` goes through the organization's gate (`/agent/quality/settings`, `gate`): without a current check, while one runs, or when it found the version worse, the call answers 409 with the reason code (`prompt_check_required`, `prompt_check_running`, `prompt_check_worse`, `prompt_check_unavailable`) as the message. With the gate `warn`, the optional body `{\"confirm\": true}` sets it anyway."
  /api/v1/agent/settings/prompts/{id}/gate:
    get: { summary: "What setting an organization Prompt as the default does now: `decision` (`allow`, `confirm`, `refuse`) with the `reason`, the gate `mode`, whether its purpose is `checked`, and its last check with `current` (the check is of this version against the present default); `agent.manage`" }
  /api/v1/agent/settings/prompts/{id}/checks:
    post: { summary: "Check an organization Prompt for `system` or `root_cause` against the present default: up to 8 answers from the regression set and the first matching evaluator's recent scores are answered again with both versions, without tools, and scored by that evaluator; returns the queued check, or the one already running; `agent.manage`" }
  /api/v1/agent/settings/prompts/{id}/restore:
    post: { summary: Restore an override body and variable schema from its built-in parent }
  /api/v1/agent/tools:
    get: { summary: "List the compile-time Mole Agent tool allowlist and runtime capabilities, with the tools of the MCP servers the current user can see" }
  /api/v1/agent/skills:
    get: { summary: "The skills the current user can see: built-in and instance-folder skills (read-only, `scope` `instance`), and the organization's, their teams' and their own uploaded and repository skills, each with `editable` and `moderatable`; `paths` lists the instance skill folders, with read problems for `agent.manage` holders" }
    post:
      summary: "Upload a skill package (multipart: `file`, `scope`, `teamId`, `replace`)"
      description: "A `.zip` or `.tar.gz` of up to 20 MiB holding one folder with `SKILL.md`. A skill of the same name in the scope answers 409 with `code` `skill_exists` unless `replace` is `true`. Organization skills need `agent.manage`; team skills a member of the team or `agent.manage`; personal skills belong to the uploader."
  /api/v1/agent/skills/rescan:
    post: { summary: "Read the instance skill folders (`[agent] skill_paths`) again; `agent.manage`" }
  /api/v1/agent/skills/{id}:
    get: { summary: "A skill with the body of its `SKILL.md` and its files" }
    patch: { summary: "Turn a skill on or off (`enabled`) or move an uploaded skill to another scope (`scope`, `teamId`)" }
    delete: { summary: Delete an uploaded skill }
  /api/v1/agent/skills/{id}/file:
    get:
      summary: One text file of a skill
      parameters:
        - { name: path, in: query, required: true, schema: { type: string } }
  /api/v1/agent/skills/{id}/package:
    get: { summary: "Download a skill: the uploaded package, or a `.zip` of its files" }
  /api/v1/agent/skill-repositories:
    get: { summary: "The skill repositories the current user can see, with their last synchronization; the access token is never returned, only `tokenSet` and `tokenLast4`" }
    post:
      summary: Add a skill repository and synchronize it once
      description: "`url`, `host` (`github`, `gitlab`, `gitea`, `bitbucket`, `archive`; read from the address when left out), `archiveUrl` with `{ref}` for `archive`, `gitRef`, `dir`, `autoSync` (daily), write-only `token`, `scope`, `teamId`. Team and personal repositories reach only public addresses and those in the network policy. The answer carries `sync`: `status` (`ok`, `partial`, `failed`), counts and `problems`."
  /api/v1/agent/skill-repositories/{id}:
    put: { summary: "Change a skill repository and synchronize it; an empty `token` keeps the saved one, `clearToken` removes it" }
    delete: { summary: Delete a skill repository with its skills }
  /api/v1/agent/skill-repositories/{id}/sync:
    post: { summary: Synchronize a skill repository now }
  /api/v1/agent/network-policy:
    get: { summary: "The internal hosts and CIDR ranges that team and personal skill repositories and MCP servers may reach; `agent.manage`" }
    put: { summary: "Set them (`privateHosts`, `privateCidrs`); `agent.manage`" }
  /api/v1/agent/mcp-servers:
    get: { summary: "The MCP servers the current user can see, with their `scope`, `handle`, headers (secret values only as `last4`), tool and prompt counts, `editable`, `moderatable` and the user's own saved credential (`myCredential`); `stdioCommands` lists the programs this instance lets an organization's stdio server start" }
    post:
      summary: Add an MCP server
      description: "`scope` (`org` by default, `team` with `teamId`, `personal`), `transport` (`streamable_http`, `sse`, or `stdio` for organization servers only: MoleSignal starts `commandTemplate` without a shell when its program is in `[agent].mcp_stdio_commands`, and the server takes its credentials in `env`, with `authType` `none` and no `headers`), `endpointUrl` or `commandTemplate`, `authType` (`none`, `bearer_token`, `api_key`, `member_secret` with `memberCredential` {`header`, `bearer`, `instructions`}, ...), write-only `credential`, `headers` and `env` as `{name, secret, value}` (names with key, token, secret, password, credential, auth or cookie are always secret; a secret without a value keeps the saved one). Organization servers need `agent.manage` and may set `privateOnly`, `allowedDomains`, `allowedCidrs` and `tlsVerify`; team and personal servers reach only public addresses and those in the network policy, and always verify TLS."
  /api/v1/agent/mcp-servers/import:
    post: { summary: "Add servers from a pasted `mcpServers` / `servers` configuration of Claude Desktop, Claude Code, Cursor or VS Code (`config` as text or JSON, `scope`, `teamId`); values that refer to variables come back in `missing`, servers of the same name in the scope in `skipped`; a server with a `command` is a stdio server, imported only into the organization and only with a command the instance allows" }
  /api/v1/agent/mcp-servers/{id}:
    get: { summary: "A server with its tools and prompts" }
    put: { summary: "Change a server or move it to another scope the user manages" }
    patch: { summary: "Turn a server on or off (`enabled`); also open to `agent.manage` holders on servers they cannot edit" }
    delete: { summary: "Delete a server once none of its tools is enabled or in use" }
  /api/v1/agent/mcp-servers/{id}/test:
    post: { summary: "Connect and list the tools; a server with member credentials uses the caller's own" }
  /api/v1/agent/mcp-servers/{id}/sync:
    post: { summary: "Import the selected tools (`selectedTools`, all when empty; new tools stay off) and the server's prompts; tools the server no longer lists become unavailable" }

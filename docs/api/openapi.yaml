  /api/v1/debug-artifacts:
    get:
      summary: List tenant-scoped RUM debug artifacts
      description: Requires `streams.read`.
      parameters:
        - { in: query, name: applicationId, schema: { type: string } }
        - { in: query, name: service, schema: { type: string } }
        - { in: query, name: kind, schema: { type: string, enum: [javascript_sourcemap, flutter_symbols, android_mapping, android_native_symbols, apple_dsym] } }
        - { in: query, name: platform, schema: { type: string, enum: [web, flutter, android, ios] } }
    post:
      summary: Upload a RUM Source Map or mobile symbol artifact
      description: Requires `streams.configure`; multipart body is limited to 50 MiB per artifact.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [applicationId, service, release, kind, platform, file]
              properties:
                applicationId: { type: string, maxLength: 128 }
                service: { type: string, maxLength: 255 }
                release: { type: string, maxLength: 64 }
                kind: { type: string, enum: [javascript_sourcemap, flutter_symbols, android_mapping, android_native_symbols, apple_dsym] }
                platform: { type: string, enum: [web, flutter, android, ios] }
                architecture: { type: string, maxLength: 32, description: 'Common ABI aliases such as arm64-v8a and aarch64 are canonicalized.' }
                debugId: { type: string, maxLength: 128, description: 'UUID or ELF build ID; hex identifiers are compared case-insensitively without punctuation.' }
                file: { type: string, format: binary, description: 'Raw artifact or gzip-compressed artifact.' }
  /api/v1/debug-artifacts/{id}:
    delete:
      summary: Delete one tenant-scoped RUM debug artifact
      description: Requires `streams.configure`.
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }


# MoleSignal HTTP API v1
# OpenAPI 3.0 描述。当前覆盖 intake / query / streams / alerts / dashboards / 派生查询 /
# 付费版 (sso/clusters/cipher_keys/connectors/agent)。
# 完整 endpoint 索引见各 handler 文件 `src/api/http/routes/*.rs`。

openapi: 3.0.3
info:
  title: MoleSignal API
  version: 1.0.0
  description: |
    MoleSignal 是可观测平台核心引擎。所有 endpoint 默认走 `Authorization: Bearer <jwt>` 鉴权；
    `/api/v1/healthz` / `/api/v1/auth/signin` / `/api/v1/auth/sso/*` / `/metrics`
    在白名单内免鉴权。

    错误统一返 `{ "error": "<message>" }` body；状态码：
    - 400 invalid argument
    - 401 unauthorized (token 校验失败)
    - 403 forbidden (IAM permission 不足)
    - 404 not found / 跨 org lookup
    - 409 conflict (unique 约束 / 状态冲突)
    - 501 profiling kind unavailable on this build
    - 413 payload too large
    - 429 rate limited

    精确流名 `_molesignal` 保留给服务自身遥测。所有公共 intake 与 stream mutation
    对该名称返回 403；`_sys` system scope 中的 IAM 查询仍然可用。
servers:
  - url: https://molesignal.example.com
  - url: http://localhost:5080

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Error:
      type: object
      properties:
        error: { type: string }
    IntakeResult:
      type: object
      properties:
        accepted: { type: integer }
        rejected: { type: integer }
        errors:
          type: array
          items:
            type: object
            properties:
              index: { type: integer }
              reason: { type: string }
    SearchJob:
      type: object
      required: [job_id, state, kind, attempt, user_id, submitted_at_micros, expires_at_micros]
      properties:
        job_id: { type: string }
        state: { type: string, enum: [pending, running, done, failed, cancelled] }
        kind:
          type: string
          enum: [query, backfill]
          description: '`backfill` is a job a data pipeline submitted to backfill a time range; `pipeline_id` names that pipeline'
        pipeline_id: { type: string, nullable: true }
        attempt: { type: integer, description: Execution generation, one higher after every retry }
        user_id: { type: string, description: The user who submitted the job }
        submitted_by:
          type: object
          nullable: true
          description: Display name and email of that user; null once the user record is gone
          properties:
            display_name: { type: string }
            email: { type: string }
        request:
          type: object
          nullable: true
          description: The query the job runs, as it was submitted; null when the stored request cannot be decoded
          properties:
            language: { type: string, enum: [sql, promql] }
            statement: { type: string }
            time_range:
              type: object
              properties:
                start: { type: integer, format: int64, description: epoch micros }
                end: { type: integer, format: int64, description: epoch micros }
            stream:
              type: object
              nullable: true
              properties:
                name: { type: string }
                stream_type: { type: string }
            limit: { type: integer, nullable: true }
        submitted_at_micros: { type: integer, format: int64 }
        started_at_micros: { type: integer, format: int64, nullable: true }
        finished_at_micros: { type: integer, format: int64, nullable: true }
        result_object_key:
          type: string
          nullable: true
          description: 'Object key of the NDJSON result of a `done` job: `search_jobs/v1/{org}/{job_id}-{attempt}.ndjson`'
        result_rows: { type: integer, format: int64, nullable: true }
        error: { type: string, nullable: true, description: Why a `failed` job failed }
        expires_at_micros:
          type: integer
          format: int64
          description: After this time the job and its result object are removed
    LogInspectionInput:
      type: object
      required: [name, stream, window_secs, schedule, timezone, provider_id, language]
      properties:
        name: { type: string, maxLength: 120, description: Unique within the organization }
        stream: { type: string, description: A logs stream of the organization; a run reads no other stream }
        statement:
          type: string
          maxLength: 8000
          description: The condition the inspected logs match, as the Logs page writes a query; empty inspects the whole stream
        window_secs:
          type: integer
          format: int64
          minimum: 300
          maximum: 604800
          description: How much time before the moment of a run the run looks over
        requirements: { type: string, maxLength: 2000, description: What the model is asked to attend to }
        schedule: { $ref: '#/components/schemas/LogInspectionSchedule' }
        timezone: { type: string, description: 'IANA time zone the time of day of a `daily` or `weekly` schedule is read in, e.g. `Asia/Shanghai`' }
        provider_id: { type: string, description: 'An AI model provider of the organization that is enabled and has a key' }
        model: { type: string, nullable: true, description: A model of that provider to use in place of its default }
        notify_when:
          type: string
          enum: [abnormal, attention, always]
          default: abnormal
          description: '`abnormal` tells of reports at level `abnormal` or `unknown`, `attention` also of `attention`, `always` of every report'
        notify_routes:
          type: array
          maxItems: 10
          description: Where a notification is sent; none repeats. Without any, nothing is sent and the reports are still kept
          items: { $ref: '#/components/schemas/LogInspectionNotifyRoute' }
        language: { type: string, enum: [en-us, zh-cn], description: The language of the reports and of the notifications }
        enabled: { type: boolean, default: true, description: Whether it runs on its schedule; a disabled inspection can still be run by hand }
    LogInspectionSchedule:
      description: How often an inspection runs. No schedule may run more often than the instance allows (`min_interval_secs` of the limits).
      oneOf:
        - type: object
          required: [type, every_minutes]
          properties:
            type: { type: string, enum: [interval] }
            every_minutes: { type: integer, minimum: 1 }
        - type: object
          required: [type, hour, minute]
          properties:
            type: { type: string, enum: [daily] }
            hour: { type: integer, minimum: 0, maximum: 23 }
            minute: { type: integer, minimum: 0, maximum: 59 }
        - type: object
          required: [type, weekday, hour, minute]
          properties:
            type: { type: string, enum: [weekly] }
            weekday: { type: integer, minimum: 1, maximum: 7, description: 1 is Monday and 7 is Sunday }
            hour: { type: integer, minimum: 0, maximum: 23 }
            minute: { type: integer, minimum: 0, maximum: 59 }
    LogInspectionNotifyRoute:
      type: object
      required: [connector_id, target_type, target]
      properties:
        connector_id: { type: string, description: A Notify connector of the organization }
        target_type: { type: string, enum: [fixed_group, fixed_address] }
        target: { type: string, maxLength: 512, description: The group or address on that connector, as the connector takes it }
    LogInspection:
      description: A saved inspection. It carries every field of `LogInspectionInput` as saved, and what the server keeps beside them.
      allOf:
        - $ref: '#/components/schemas/LogInspectionInput'
        - type: object
          required: [id, run_as_user_id, created_by, created_at_micros, updated_at_micros]
          properties:
            id: { type: string }
            run_as_user_id: { type: string, description: The user every run reads the logs as; whoever saved the inspection last }
            run_as_user:
              type: object
              nullable: true
              description: Name and email of that user; null once the user record is gone
              properties:
                id: { type: string }
                display_name: { type: string }
                email: { type: string }
            next_run_at_micros: { type: integer, format: int64, nullable: true, description: Null while the inspection is disabled }
            last_run:
              type: object
              nullable: true
              description: How the run that ended last went; null before the first has ended
              properties:
                at_micros: { type: integer, format: int64 }
                status: { type: string, enum: [succeeded, failed, timed_out] }
                level: { type: string, enum: [normal, attention, abnormal, unknown], nullable: true }
            active_run:
              type: object
              nullable: true
              description: The run that waits or is under way; an inspection has at most one
              properties:
                id: { type: string }
                status: { type: string, enum: [queued, running] }
                trigger: { type: string, enum: [schedule, manual] }
                created_at_micros: { type: integer, format: int64 }
                started_at_micros: { type: integer, format: int64, nullable: true }
            created_by: { type: string }
            created_at_micros: { type: integer, format: int64 }
            updated_at_micros: { type: integer, format: int64 }
    LogInspectionRun:
      type: object
      required: [id, inspection_id, trigger, status, window_start_micros, window_end_micros, created_at_micros]
      properties:
        id: { type: string }
        inspection_id: { type: string }
        trigger: { type: string, enum: [schedule, manual] }
        status: { type: string, enum: [queued, running, succeeded, failed, timed_out] }
        level:
          type: string
          enum: [normal, attention, abnormal, unknown]
          nullable: true
          description: 'The verdict of the report of a `succeeded` run; `unknown` when the model stated none'
        window_start_micros: { type: integer, format: int64 }
        window_end_micros: { type: integer, format: int64 }
        summary: { type: string, nullable: true, description: The summary of the report, as notifications quote it }
        report: { type: string, nullable: true, description: What the model wrote; always null in a list of runs }
        failure:
          type: string
          nullable: true
          enum: [timed_out, interrupted, not_started, identity, model, agent, internal]
          description: >-
            Why a run left no report: it exceeded its time limit, the node running it stopped, no node
            picked it up, the user it runs as can no longer be used, the model is missing, disabled or
            without a key, the call to the model failed, or an internal cause
        error: { type: string, nullable: true, description: Technical detail of the failure }
        provider_id: { type: string, nullable: true }
        model: { type: string, nullable: true, description: The model that was called }
        run_as_user_id: { type: string, nullable: true }
        requested_by: { type: string, nullable: true, description: 'The user who asked for a `manual` run' }
        requested_by_user:
          type: object
          nullable: true
          properties:
            id: { type: string }
            display_name: { type: string }
            email: { type: string }
        tool_calls:
          type: array
          description: The tools the model called, in order
          items:
            type: object
            properties:
              name: { type: string }
              ok: { type: boolean }
        prompt_tokens: { type: integer, format: int64 }
        completion_tokens: { type: integer, format: int64 }
        notifications:
          type: array
          description: Whom the run told, one entry per channel
          items:
            type: object
            properties:
              connector_id: { type: string }
              target_type: { type: string, enum: [fixed_group, fixed_address] }
              target_masked: { type: string }
              delivered: { type: boolean }
              error: { type: string, nullable: true }
        created_at_micros: { type: integer, format: int64 }
        started_at_micros: { type: integer, format: int64, nullable: true }
        finished_at_micros: { type: integer, format: int64, nullable: true }
    ApmResponseMeta:
      type: object
      required: [range, resolution, data_quality, activation_boundary]
      properties:
        range:
          type: object
          properties:
            from: { type: integer, format: int64, description: epoch micros }
            to: { type: integer, format: int64, description: epoch micros }
        resolution: { type: string, enum: [minute, hour] }
        projection_started_at: { type: integer, format: int64, nullable: true }
        last_complete_bucket_at: { type: integer, format: int64, nullable: true }
        activation_boundary: { type: boolean }
        data_quality:
          type: object
          required: [partial, gaps, overflow_dimensions]
          properties:
            partial: { type: boolean }
            gaps: { type: array, items: { type: object } }
            overflow_dimensions: { type: array, items: { type: string } }

security:
  - bearerAuth: []

paths:
  /api/v1/healthz:
    get:
      summary: Liveness + readiness probe
      security: []
      responses:
        '200': { description: ready }
        '503': { description: degraded (intake replay / object_store probe failing) }

  /metrics:
    get:
      summary: Prometheus exposition
      security: []
      responses:
        '200':
          description: text/plain; version=0.0.4
          content:
            text/plain: {}

  /api/v1/iam/permissions:
    get:
      summary: Read the database-backed IAM permission catalog
      description: Requires `iam.roles.read` or `iam.policies.read`.
      responses:
        '200': { description: Versioned permissions, role mappings, relation mappings, and bundles }
        '403': { description: Missing IAM catalog read permission }

  /api/v1/iam/capabilities:
    get:
      summary: Resolve capabilities for the signed active organization
      responses:
        '200': { description: Organization, scope, display role, permissions, features, policy version, and database-resolved route/navigation decisions }

  /api/v1/iam/share-targets:
    get:
      summary: List non-system organizations eligible as explicit share targets
      description: Requires `iam.policies.manage`.
      responses:
        '200': { description: Sorted organization id/name options }

  /api/v1/iam/role-bindings:
    get: { summary: List IAM role bindings }
    post: { summary: Create a validated organization/resource role binding }
  /api/v1/iam/role-bindings/{id}:
    delete:
      summary: Delete an IAM role binding and increment the policy version
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }

  /api/v1/iam/relationships:
    get: { summary: List direct IAM resource relationships }
    post: { summary: Create a bounded direct resource relationship }
  /api/v1/iam/relationships/{id}:
    delete:
      summary: Delete an IAM resource relationship
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }

  /api/v1/iam/cross-org-grants:
    get: { summary: List incoming and outgoing explicit cross-organization grants }
    post: { summary: Create a non-transitive pending cross-organization grant }
  /api/v1/iam/cross-org-grants/{id}/accept:
    post:
      summary: Accept a pending grant from its target organization
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
  /api/v1/iam/cross-org-grants/{id}/revoke:
    post:
      summary: Revoke a grant from its source or target organization
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }

  /api/v1/iam/evaluate-batch:
    post:
      summary: Evaluate up to 100 ordered IAM permission/resource requests
      responses:
        '200': { description: Ordered IAM decisions with reasons and matched ids }
        '400': { description: Unknown permission, invalid target, or oversized batch }

  /api/v1/system/platform-admins:
    get:
      summary: Read the configured root platform-administrator assignment
      description: Requires a system-scoped JWT with sys.administrators.manage. The assignment is reconciled at startup and cannot be granted or revoked through the API.
      responses:
        '200': { description: The single active root assignment }
        '404': { description: Hidden from tenant scope }

  /api/v1/system/telemetry:
    get:
      summary: Read effective distributed Trace policy and detailed health
      description: |
        Requires SystemTelemetryRead in system scope. Includes deployment/runtime precedence,
        tail-sampler/router/sink metrics, and fixed exporter/capacity/drop/system-load alerts.
      responses:
        '200': { description: Effective policy and non-fatal detailed health }
        '404': { description: Hidden from tenant scope }
    put:
      summary: Atomically publish a runtime Trace policy
      description: |
        Requires SystemTelemetryManage. Static endpoint, protocol, TLS/mTLS, authentication,
        compression, and Resource identity remain deployment configuration.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200': { description: Newly active policy }
        '400': { description: Invalid bounded policy }
        '404': { description: Hidden from tenant scope }

  /api/v1/system/telemetry/policies:
    get:
      summary: List immutable Trace policy history
      responses:
        '200': { description: Version history with active marker }
        '404': { description: Hidden from tenant scope }

  /api/v1/system/telemetry/debug-tokens:
    get:
      summary: List Trace debug-token metadata
      description: Plaintext token values are never returned after issuance.
      responses:
        '200': { description: Token metadata }
        '404': { description: Hidden from tenant scope }
    post:
      summary: Issue a bounded one-time-visible Trace debug token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ttl_seconds]
              properties:
                organization_id: { type: string, nullable: true }
                route_pattern: { type: string, nullable: true }
                ttl_seconds: { type: integer, minimum: 1, maximum: 3600 }
                max_uses: { type: integer, minimum: 1, maximum: 10000, default: 100 }
      responses:
        '201': { description: Metadata plus the plaintext token exactly once }
        '404': { description: Hidden from tenant scope }

  /api/v1/system/telemetry/debug-tokens/{id}:
    delete:
      summary: Revoke a Trace debug token
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '204': { description: Revoked }
        '404': { description: Hidden or token not found }

  /api/v1/auth/signin:
    post:
      summary: Email + password login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string }
                password: { type: string }
      responses:
        '200':
          description: JWT issued
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
                  user_id: { type: string }
                  org_id: { type: string }
                  display_role: { type: string }
                  roles:
                    type: array
                    items:
                      type: object
                      required: [id, key, name, builtin]
                      properties:
                        id: { type: string }
                        key: { type: string }
                        name: { type: string }
                        builtin: { type: boolean }
        '401': { $ref: '#/components/schemas/Error' }

  /api/v1/auth/sso/login:
    get:
      summary: SSO OIDC login redirect
      security: []
      responses:
        '302': { description: redirect to IdP /authorize }

  /api/v1/auth/sso/callback:
    get:
      summary: SSO OIDC callback
      security: []
      parameters:
        - { in: query, name: code, required: true, schema: { type: string } }
        - { in: query, name: state, schema: { type: string } }
      responses:
        '200': { description: JWT issued }
        '401': { description: IdP error / id_token invalid }

  /api/v1/auth/sso/providers:
    get:
      summary: List enabled external login providers without secret configuration
      security: []
      responses:
        '200':
          description: Empty in community mode; otherwise enabled OIDC, SAML, and LDAP providers
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [id, name, kind]
                  properties:
                    id: { type: string }
                    name: { type: string }
                    kind: { type: string, enum: [oidc, saml, ldap] }

  /api/v1/auth/sso/ldap/login:
    post:
      summary: LDAP search and user simple-bind login
      description: |
        Resolves exactly one user DN with the configured escaped search filter, binds as that
        user over LDAPS or StartTLS, applies the configured identity-field and group-to-role
        mappings, provisions the local membership, and issues a local JWT.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [provider_id, username, password]
              properties:
                provider_id: { type: string }
                username: { type: string, maxLength: 320 }
                password: { type: string, format: password, maxLength: 1024 }
      responses:
        '200': { description: Local JWT and organization context issued }
        '401': { description: Provider, user, or credentials invalid }
        '503': { description: LDAP directory unavailable }

  /api/v1/sso/providers:
    get:
      summary: List organization SSO providers (secrets redacted)
    post:
      summary: Create an OIDC, SAML, or LDAP provider
      description: |
        Each provider config accepts `field_mapping` with `subject`, `email`, `display_name`,
        and `groups`. It also accepts `group_role_mapping` (external group value to organization
        role id) and an optional `default_role_id`. Every referenced role must belong to the
        provider organization.

  /api/v1/sso/providers/roles:
    get:
      summary: List organization roles assignable by SSO mappings
      description: Returns only role ids and names and uses the SSO settings read permission.

  /api/v1/sso/providers/{id}:
    get: { summary: Read one organization SSO provider with secrets redacted }
    put:
      summary: Update one provider; omitted secrets retain their saved values
      description: Identity-field and role mappings replace the previously saved mappings.
    delete: { summary: Delete one provider }

  /api/v1/intake/logs/{stream}:
    post:
      summary: HTTP JSON intake (logs)
      parameters:
        - { in: path, name: stream, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - { type: object }
                - { type: array, items: { type: object } }
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IntakeResult' }
        '413': { description: payload too large }
        '429': { description: rate limited }

  /api/v1/intake/metrics/{stream}: { $ref: '#/paths/~1api~1v1~1intake~1logs~1{stream}' }
  /api/v1/intake/traces/{stream}: { $ref: '#/paths/~1api~1v1~1intake~1logs~1{stream}' }

  /api/v1/_bulk:
    post:
      summary: Elasticsearch _bulk-compatible intake (NDJSON)
      requestBody:
        required: true
        content:
          application/x-ndjson: {}
      responses:
        '200':
          description: per-record status array (ES-compatible items[])

  /api/v1/prometheus/api/v1/write:
    post:
      summary: Prometheus remote_write samples and native Exemplars (snappy + protobuf)
      requestBody:
        required: true
        content:
          application/x-protobuf: {}
      responses:
        '204': { description: accepted }

  /api/v1/prometheus/api/v1/query_exemplars:
    get:
      summary: Query Prometheus-native Exemplars
      parameters:
        - { in: query, name: query, required: true, schema: { type: string } }
        - { in: query, name: start, required: true, schema: { type: string }, description: Epoch seconds or RFC3339 }
        - { in: query, name: end, required: true, schema: { type: string }, description: Epoch seconds or RFC3339 }
      responses:
        '200':
          description: Prometheus-compatible Exemplar response
          content:
            application/json:
              schema:
                type: object
                required: [status, data]
                properties:
                  status: { type: string, enum: [success] }
                  data:
                    type: array
                    items:
                      type: object
                      required: [seriesLabels, exemplars]
                      properties:
                        seriesLabels:
                          type: object
                          additionalProperties: { type: string }
                        exemplars:
                          type: array
                          items:
                            type: object
                            required: [labels, value, timestamp]
                            properties:
                              labels:
                                type: object
                                additionalProperties: { type: string }
                              value: { type: number, format: double }
                              timestamp: { type: number, format: double }
                  warnings:
                    type: array
                    items: { type: string }
    post:
      summary: Query Prometheus-native Exemplars using form parameters
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [query, start, end]
              properties:
                query: { type: string }
                start: { type: string, description: Epoch seconds or RFC3339 }
                end: { type: string, description: Epoch seconds or RFC3339 }
      responses:
        '200': { description: Prometheus-compatible Exemplar response }

  /api/v1/loki/api/v1/push:
    post:
      summary: Loki push (snappy-protobuf or JSON)
      responses:
        '204': { description: accepted }

  /api/v1/_kinesis_firehose:
    post:
      summary: AWS Kinesis Firehose push
      responses:
        '200': { description: firehose-compatible ack }

  /api/v1/_cloudflare:
    post:
      summary: Cloudflare Logpush push (NDJSON)
      parameters:
        - { in: header, name: X-Connector-Token, required: true, schema: { type: string } }
      responses:
        '204': { description: accepted }

  /api/v1/_heroku:
    post:
      summary: Heroku log drain push (text)
      parameters:
        - { in: header, name: X-Connector-Token, required: true, schema: { type: string } }
      responses:
        '204': { description: accepted }

  /api/v1/query:
    post:
      summary: Execute SQL or PromQL query
      parameters:
        - in: header
          name: Accept
          description: '`application/x-ndjson` 走 streaming（bypass query_result cache）'
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [org_id, language, statement, time_range]
              properties:
                org_id: { type: string }
                language: { type: string, enum: [sql, promql] }
                statement: { type: string }
                time_range:
                  type: object
                  properties:
                    start: { type: integer }
                    end: { type: integer }
                stream:
                  type: object
                  properties:
                    name: { type: string }
                    stream_type: { type: string, enum: [logs, metrics, traces, enrichment] }
                limit: { type: integer }
      responses:
        '200':
          description: query result (rows + columns + scanned_rows + took_ms + cache_hit)

  /api/v1/query/search_around:
    post:
      summary: 前后 N 条上下文
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [event_timestamp_us, stream, stream_type]
              properties:
                event_timestamp_us: { type: integer }
                event_fingerprint: { type: string }
                stream: { type: string }
                stream_type: { type: string }
                before: { type: integer, default: 50 }
                after: { type: integer, default: 50 }
      responses:
        '200': { description: before + after blocks }

  /api/v1/query/jobs:
    post:
      summary: Submit an asynchronous search job (streams.query or sys.telemetry.read)
      description: >-
        Takes the body of `/api/v1/query` and, optionally, `ttl_secs`: how long the job and its
        result are kept, 60 seconds to 30 days, 7 days when left out. The job is queued; a querier
        node runs it and writes the rows as NDJSON to object storage. `POST /api/v1/query` with
        `Prefer: respond-async` and a pipeline backfill queue the same kind of job.
      responses:
        '200':
          description: The queued job
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SearchJob' }
    get:
      summary: List search jobs, most recently submitted first
      description: >-
        A job belongs to the user who submitted it. The caller is listed their own jobs; a caller
        holding `org.settings.manage` (`sys.telemetry.manage` in system scope) is listed the jobs
        of everybody in the organization. The same rule decides every other operation on a job:
        to anyone else, another user's job answers 404, as a job that does not exist.
      parameters:
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 1000, default: 100 } }
        - in: query
          name: offset
          description: How many of the most recent jobs to skip; with `limit` it pages through the list
          schema: { type: integer, minimum: 0, default: 0 }
        - in: query
          name: state
          description: >-
            Only jobs in these states, separated by commas (`pending,running`). All states when
            left out or empty.
          schema: { type: string }
      responses:
        '200':
          description: One page of jobs
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/SearchJob' }
        '400': { description: '`state` names a state that does not exist' }

  /api/v1/query/jobs/summary:
    get:
      summary: How many search jobs there are in each state
      description: >-
        Counts the jobs the caller is listed (their own, or the organization's for an
        administrator), whatever state the list is filtered to and whatever page it shows.
      responses:
        '200':
          description: Job counts
          content:
            application/json:
              schema:
                type: object
                required: [pending, running, done, failed, cancelled, total]
                properties:
                  pending: { type: integer, format: int64 }
                  running: { type: integer, format: int64 }
                  done: { type: integer, format: int64 }
                  failed: { type: integer, format: int64 }
                  cancelled: { type: integer, format: int64 }
                  total: { type: integer, format: int64 }

  /api/v1/query/jobs/{id}:
    get:
      summary: Read one search job (its submitter, or an administrator)
      responses:
        '200':
          description: The job
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SearchJob' }
        '404': { description: No such job, or a job submitted by another user }
    delete:
      summary: Delete a search job and its result object; a job that is still running is cancelled first
      responses: { '200': { description: '`{ "deleted": true }`' } }
  /api/v1/query/jobs/{id}/results:
    get:
      summary: Read one page of the rows of a `done` search job
      parameters:
        - { in: query, name: page, schema: { type: integer, minimum: 1, default: 1 } }
        - { in: query, name: page_size, schema: { type: integer, minimum: 1, maximum: 10000, default: 1000 } }
      responses:
        '200':
          description: >-
            state, result_rows, page, page_size, rows (one object per row; empty until the job is
            `done`), has_more and error
  /api/v1/query/jobs/{id}/cancel:
    post:
      summary: Cancel a `pending` or `running` search job
      responses:
        '200':
          description: The cancelled job
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SearchJob' }
        '400': { description: The job has already finished }
  /api/v1/query/jobs/{id}/retry:
    post:
      summary: Queue a `failed` or `cancelled` search job again as a new attempt
      responses:
        '200':
          description: The job, `pending` again with `attempt` one higher
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SearchJob' }
        '400': { description: The job is not `failed` or `cancelled` }


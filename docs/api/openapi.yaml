  /api/v1/agent/mcp-servers/{id}/sync:
    post: { summary: "Import the selected tools (`selected_tools`, all when empty; new tools stay off) and the server's prompts; tools the server no longer lists become unavailable" }
  /api/v1/agent/mcp-servers/{id}/tools:

  /api/v1/agent/automations/{id}:
    get: { summary: Get an automation }
    put: { summary: Update an automation }
  /api/v1/agent/automations/{id}/dry-run:
    post: { summary: Resolve a no-side-effect automation dry run }
  /api/v1/agent/approvals:
    get: { summary: List Mole Agent operation approvals }

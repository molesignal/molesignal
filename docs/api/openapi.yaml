  # ---- web-investigation-shell (frontend ⌘K / 调查栈 / 跨信号联动) ----
  /api/v1/web/search:
    get:
      summary: Cross-entity ⌘K aggregated search (streams / dashboards / saved_views / alerts / incidents / services)
      description: |
        Returns up to `limit` (default 20, max 50) hits ranked by pg_trgm similarity.
        Requires `Permission::WebSearch` (all authenticated users by default).
      parameters:
        - { name: q, in: query, required: true, schema: { type: string } }
        - { name: types, in: query, required: false, schema: { type: string },
            description: "Comma-separated subset of {stream,dashboard,saved_view,alert,incident,service}" }
        - { name: limit, in: query, required: false, schema: { type: integer, default: 20, maximum: 50 } }
  /api/v1/web/topology:
    get:
      summary: Aggregate service_graph_edges into nodes / edges within (from, to)
      parameters:
        - { name: from, in: query, required: true, schema: { type: string, format: date-time } }
        - { name: to,   in: query, required: true, schema: { type: string, format: date-time } }
  /api/v1/web/trace/{trace_id}:
    get:
      summary: Full span tree for a trace_id (≤ 100k spans, 32 MiB hard cap → truncated=true)
      parameters:
        - { name: trace_id, in: path, required: true, schema: { type: string } }
  /api/v1/web/correlation/{from_kind}/{to_kind}:
    get:
      summary: Server-side prefill of filters/time/prefill for metric ↔ trace ↔ log ↔ host jumps
      parameters:
        - { name: from_kind, in: path, required: true, schema: { type: string, enum: [trace, metric, log, host] } }
        - { name: to_kind,   in: path, required: true, schema: { type: string, enum: [trace, metric, log, host] } }
        - { name: ctx,       in: query, required: true, schema: { type: string },
            description: "base64-url JSON blob of source signal context" }
  /api/v1/web/investigation/blob:
    post:
      summary: Store ephemeral investigation-stack payload (returns blob_id, 7d retention)
  /api/v1/web/investigation/blob/{id}:
    get:
      summary: Fetch ephemeral payload by blob_id
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }

  /api/v1/query/stream:
    get:
      summary: NDJSON streamed query response (chunked; ingress proxy_buffering must be off)
      parameters:
        - { name: sql,         in: query, required: true,  schema: { type: string } }
        - { name: stream,      in: query, required: true,  schema: { type: string } }
        - { name: stream_type, in: query, required: false, schema: { type: string, enum: [logs, metrics, traces] } }
        - { name: from,        in: query, required: true,  schema: { type: integer, format: int64, description: "epoch micros" } }
        - { name: to,          in: query, required: true,  schema: { type: integer, format: int64 } }
        - { name: limit,       in: query, required: false, schema: { type: integer } }
    post:
      summary: Same shape as POST /query but always returns NDJSON chunked response

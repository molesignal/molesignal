        - { in: query, name: namespace, schema: { type: string } }
        - { in: query, name: environment, schema: { type: string } }
        - { in: query, name: version, schema: { type: string } }
      responses:
        '200': { description: Service RED, trend, Transactions, dependencies, errors, versions, exemplars and data quality }
        '404': { description: Service absent in the active organization }
  /api/v1/apm/transactions:
    get:
      summary: Paginated Transaction performance ranking
      parameters: *apmQueryParameters
      responses: { '200': { description: "Cursor page of request/error counts, merged percentiles, total time, and Trace filter handles" } }
  /api/v1/apm/transactions/{transaction}:
    get:
      summary: Transaction performance workbench
      parameters:
        - { in: path, name: transaction, required: true, schema: { type: string } }
        - { in: query, name: from, schema: { type: integer, format: int64 } }
        - { in: query, name: to, schema: { type: integer, format: int64 } }
        - { in: query, name: namespace, schema: { type: string } }
        - { in: query, name: service, schema: { type: string } }
        - { in: query, name: environment, schema: { type: string } }
        - { in: query, name: version, schema: { type: string } }
        - { in: query, name: kind, schema: { type: string, enum: [http, rpc, messaging, span, other] } }
        - { in: query, name: resolution, schema: { type: string, enum: [auto, minute, hour] } }
      responses:
        '200': { description: Transaction RED summary/trend, representative Traces, errors, versions, and cross-signal filter handles }
        '400': { description: Transaction identity is ambiguous without enough service or kind context }
        '404': { description: Transaction absent in the active organization }
  /api/v1/apm/dependencies:
    get:
      summary: Paginated dependency performance ranking
      parameters: *apmQueryParameters
      responses: { '200': { description: "Cursor page of caller-scoped dependency RED and safe drilldown handles" } }
  /api/v1/apm/errors:
    get:
      summary: Paginated backend error groups
      parameters: *apmQueryParameters
      responses: { '200': { description: "Cursor page of sanitized backend error groups and occurrence trends" } }
  /api/v1/apm/errors/{fingerprint}:
    get:
      summary: Backend error detail
      parameters:
        - { in: path, name: fingerprint, required: true, schema: { type: string } }
        - { in: query, name: from, schema: { type: integer, format: int64 } }
        - { in: query, name: to, schema: { type: integer, format: int64 } }
      responses:
        '200': { description: Sanitized representative stack/message and explicit Trace availability }
        '404': { description: Error group absent in the active organization }
  /api/v1/apm/versions/compare:
    get:
      summary: Compare baseline and candidate service versions
      parameters:
        - { in: query, name: service, required: true, schema: { type: string } }
        - { in: query, name: baseline, required: true, schema: { type: string } }
        - { in: query, name: candidate, required: true, schema: { type: string } }
        - { in: query, name: from, schema: { type: integer, format: int64 } }
        - { in: query, name: to, schema: { type: integer, format: int64 } }
        - { in: query, name: namespace, schema: { type: string } }
        - { in: query, name: environment, schema: { type: string } }
      responses: { '200': { description: Sample counts, sufficiency, RED deltas, and regression breakdown } }
  /api/v1/apm/health:
    get:
      summary: Tenant APM projection health and data-quality boundary
      parameters: *apmQueryParameters
      responses:
        '200': { description: Non-readiness APM runtime health, projection start, completion and gaps }

  /api/v1/rum/events:
    post:
      summary: Send RUM events (`rum.write`)
      description: 'The body is a JSON array of events, one event, or NDJSON, optionally gzip-compressed (`Content-Encoding: gzip`), with at most 5000 events and 5 MiB decoded. An event follows `contracts/rum/events/v1.schema.json` and is accepted or refused on its own. An application-bound client token writes to its own application; any other credential names the application in `application.id`. The application has to exist.'
      responses:
        '200': { description: 'accepted, rejected (the index and the reason of each event that was refused) and, when the application keeps a share of its sessions, sampled: the events of sessions it does not keep, which were left out on purpose' }
        '413': { description: 'The decoded body is above the limit' }

  /api/v1/rum/applications:
    get:
      summary: List the RUM applications of the organization
      responses: { '200': { description: 'Applications with id, name, platform and settings' } }
    post:
      summary: Create a RUM application (`api_tokens.manage`)
      description: 'An event for an application that does not exist is refused, so an application is created before an SDK sends to it. `id` is made from the name when left out and cannot change. An identifier or a name that exists answers 409. `settings` holds collectIp, collectGeo, defaultPrivacy (mask or allow), issuesPerHour (1 to 10000), scrub (the kinds of sensitive text taken out of an event before it is stored: secrets, emails, phones, cards, national_ids and url_params, all by default) sessionSampleRate (the percentage of the sessions that no retention filter describes that is kept, 0 to 100, 100 by default; a session is kept or dropped as a whole, replay included), retentionFilters (up to 10 filters { id?, name, rate, conditions: [{ field, op, values }] } that give a share of their own to the sessions they describe; the first one that describes a session decides its share; a field is env, service, version, source, session.type, geo.country_iso_code, browser.name, os.name or device.type, an op is is or is_not, a condition lists 1 to 20 values and a filter has at most 5 conditions; names are used once whatever their case; an id is made from the name when left out) and keepErrors (keep the errors of sessions that are not kept, true by default); one left out takes its default.'
      responses: { '200': { description: 'The new application' } }

  /api/v1/rum/applications/{id}:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string } }
    get:
      summary: Read one RUM application
      responses: { '200': { description: 'The application' } }
    patch:
      summary: Change the name, platform or settings of a RUM application (`api_tokens.manage`)
      description: 'A setting left out keeps its value; retentionFilters, when given, replaces the whole list. A sessionSampleRate above 100, or a list of filters that is not right, answers 400.'
      responses: { '200': { description: 'The application' } }
    delete:
      summary: Delete a RUM application and revoke its client token (`api_tokens.manage`)
      description: The events it already sent stay in the streams until their retention ends them.
      responses: { '200': { description: 'deleted' } }

  /api/v1/rum/schema/{type}:
    get:
      summary: Columns of a RUM type, with data types, units and what can be filtered
      parameters:
        - { in: path, name: type, required: true, schema: { $ref: '#/components/schemas/RumType' } }
      responses: { '200': { description: 'idField, versioned, defaultColumns and fields' } }

  /api/v1/rum/search:
    get:
      summary: A page of the rows of a RUM type, newest first
      description: '`filters`, `freeText` and `columns` are JSON-encoded lists in the address. `POST` takes the same names in a JSON body, for queries too long for an address. Views and sessions appear once, in their latest version.'
      parameters:
        - { in: query, name: type, required: true, schema: { $ref: '#/components/schemas/RumType' } }
        - { in: query, name: from, schema: { type: integer, format: int64 }, description: 'Microseconds since the Unix epoch; 24 hours before `to` by default' }
        - { in: query, name: to, schema: { type: integer, format: int64 }, description: 'Microseconds since the Unix epoch; now by default' }
        - { in: query, name: filters, schema: { type: string }, description: 'JSON list of { field, op, value }; op is one of =, !=, in, not_in, contains, >, >=, <, <=, exists, missing' }
        - { in: query, name: freeText, schema: { type: string }, description: 'JSON list of up to 8 words, each found in a text column' }
        - { in: query, name: columns, schema: { type: string }, description: 'JSON list of columns; the defaults of the type when left out' }
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 5000, default: 100 } }
        - { in: query, name: cursor, schema: { type: string }, description: 'The nextCursor or previousCursor of an earlier answer' }
      responses: { '200': { description: "items, previousCursor, nextCursor, and hasMore" } }
    post:
      summary: A page of the rows of a RUM type, with the selection in the body
      responses: { '200': { description: "items, previousCursor, nextCursor, and hasMore" } }

  /api/v1/rum/facets:
    get:
      summary: The commonest values of a field across the rows a RUM query matches
      description: 'Takes the selection of `search` (type, from, to, filters, freeText) and counts every matching row. A count that takes too long or finds the system busy answers an empty list with `unavailable`. `POST` takes the same names in a JSON body.'
      parameters:
        - { in: query, name: type, required: true, schema: { $ref: '#/components/schemas/RumType' } }
        - { in: query, name: field, required: true, schema: { type: string } }
        - { in: query, name: from, schema: { type: integer, format: int64 } }
        - { in: query, name: to, schema: { type: integer, format: int64 } }
        - { in: query, name: filters, schema: { type: string } }
        - { in: query, name: freeText, schema: { type: string } }
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 100, default: 10 } }
      responses: { '200': { description: "field and values: the commonest first, each with value and count" } }
    post:
      summary: The commonest values of a field, with the selection in the body
      responses: { '200': { description: "field and values" } }

  /api/v1/rum/keys:
    get:
      summary: The keys found in a JSON column across the rows a RUM query matches
      description: 'Takes the selection of `search` and names the feature flags evaluated, the custom timings marked, the keys of the context or of the properties of a person, each with how many sessions had it, the one most sessions had first. A key is then named like a column, as `feature_flags.<key>`. `POST` takes the same names in a JSON body.'
      parameters:
        - { in: query, name: type, schema: { $ref: '#/components/schemas/RumType' }, description: '`views` when left out' }
        - { in: query, name: column, required: true, schema: { type: string, enum: [feature_flags, context, view.custom_timings, usr.extra] } }
        - { in: query, name: from, schema: { type: integer, format: int64 } }
        - { in: query, name: to, schema: { type: integer, format: int64 } }
        - { in: query, name: filters, schema: { type: string } }
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 500, default: 100 } }
      responses: { '200': { description: "column and keys, each with key and sessions, and unavailable when there are no numbers" } }
    post:
      summary: The keys of a JSON column, with the selection in the body
      responses: { '200': { description: 'column and keys' } }

  /api/v1/rum/distribution:
    get:
      summary: How the values of a number fall across the rows a RUM query matches
      description: 'Takes the selection of `search`. Counts the rows that are stored in bars of one width from the smallest value to the 99th percentile; the last bar counts what lies past it. Values that are all the same are one bar. `POST` takes the same names in a JSON body.'
      parameters:
        - { in: query, name: type, required: true, schema: { $ref: '#/components/schemas/RumType' } }
        - { in: query, name: field, required: true, schema: { type: string }, description: 'A number, or a key of a JSON column that holds one' }
        - { in: query, name: from, schema: { type: integer, format: int64 } }
        - { in: query, name: to, schema: { type: integer, format: int64 } }
        - { in: query, name: filters, schema: { type: string } }
        - { in: query, name: freeText, schema: { type: string } }
        - { in: query, name: bars, schema: { type: integer, minimum: 1, maximum: 100, default: 40 } }
      responses:
        '200': { description: "field, unit, rows, min, max, p50, p75, p95, p99, bars (from, to, rows) and unavailable when there are no numbers" }
        '400': { description: 'A field that is not a number of the type' }
    post:
      summary: How the values of a number fall, with the selection in the body
      responses: { '200': { description: 'field, unit, rows, bars' } }

  /api/v1/rum/heatmaps/clicks:
    get:
      summary: The elements of a page people click, and where in them (`rum.analytics.read`)
      description: 'Takes from, to and filters, usually the application, the page and the width of the window. Counts the rows that are stored. Each element has clicks, sessions, frustrated, name, selector, pageX and pageY (the average place of its clicks on the page) and cells, each [column, row, clicks] of 10 by 10 cells of the element. `POST` takes the same names in a JSON body.'
      parameters:
        - { in: query, name: from, schema: { type: integer, format: int64 } }
        - { in: query, name: to, schema: { type: integer, format: int64 } }
        - { in: query, name: filters, schema: { type: string } }
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 300, default: 100 } }
      responses: { '200': { description: "clicks, elements, from, to and unavailable when there are no numbers" } }
    post:
      summary: The clicks of a page, with the request in the body
      responses: { '200': { description: 'clicks, elements' } }

  /api/v1/rum/heatmaps/scroll:
    get:
      summary: How far down a page people go (`rum.analytics.read`)
      description: 'Takes from, to and filters. A band is 100 CSS pixels, and `reached` is the share of the views that saw that depth. `POST` takes the same names in a JSON body.'
      parameters:
        - { in: query, name: from, schema: { type: integer, format: int64 } }
        - { in: query, name: to, schema: { type: integer, format: int64 } }
        - { in: query, name: filters, schema: { type: string } }
      responses: { '200': { description: "views, pageHeight, medianDepth, bands (depth, reached), from, to and unavailable when there are no numbers" } }
    post:
      summary: The depths of a page, with the request in the body
      responses: { '200': { description: 'views, bands' } }

  /api/v1/rum/heatmaps/snapshot:
    get:
      summary: A recording of a page to draw a map over (`rum.replay.read`)
      description: 'Takes from, to, filters and viewId, one of the candidates. Answers candidates, up to 20 views of the page with a replay, the newest first, and snapshot, the rrweb events that build the page at the moment it had loaded, or null when no session that opened the page was recorded. `POST` takes the same names in a JSON body.'
      parameters:
        - { in: query, name: from, schema: { type: integer, format: int64 } }
        - { in: query, name: to, schema: { type: integer, format: int64 } }
        - { in: query, name: filters, schema: { type: string } }
        - { in: query, name: viewId, schema: { type: string } }
      responses: { '200': { description: "candidates and snapshot" } }
    post:
      summary: A recording of a page, with the request in the body
      responses: { '200': { description: 'candidates and snapshot' } }

  /api/v1/rum/sessions/{id}/comments:
    get:
      summary: The comments on the replay of a session (`rum.replay.read`)
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      responses: { '200': { description: "comments, the earliest moment first, each with id, application, sessionId, atTime, body, authorId, authorName, createdAt, updatedAt and editable" } }
    post:
      summary: Comment on a moment of a replay (`rum.replay.comments.write`)
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        '200': { description: 'The comment' }
        '400': { description: 'A body that is not 1 to 2,000 characters, a moment before the epoch, or a session that holds 500 comments' }

  /api/v1/rum/sessions/{id}/comments/{commentId}:
    patch:
      summary: Change a comment (`rum.replay.comments.write` for your own, `rum.replay.comments.manage` for another's)
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
        - { in: path, name: commentId, required: true, schema: { type: string } }
      responses: { '200': { description: 'The comment' }, '403': { description: "The comment is someone else's" } }
    delete:
      summary: Delete a comment (`rum.replay.comments.write` for your own, `rum.replay.comments.manage` for another's)
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
        - { in: path, name: commentId, required: true, schema: { type: string } }
      responses: { '200': { description: '{ deleted: true }' }, '403': { description: "The comment is someone else's" } }

  /api/v1/rum/sessions/{id}/summary:
    get:
      summary: The AI summary of a session in the language of the reader (`rum.replay.read`)
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      responses: { '200': { description: "summary, or null: sessionId, language, summary, chapters (atTime, title, summary), model, promptTokens, completionTokens, generatedAt" } }
    post:
      summary: Write the AI summary of a session with a model (`rum.replay.summaries.generate`)
      description: 'A summary that is kept is answered without calling the model. `{ "regenerate": true }` calls it again unless the session has not changed. The call counts against the daily budget of Mole Agent with the origin `replay_summary`.'
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        '200': { description: 'summary' }
        '400': { description: 'No enabled model provider with a key, or nothing happened in the session' }
        '429': { description: 'The daily budget is used up' }

  /api/v1/rum/config:
    get:
      summary: What the settings of the application say to its SDK (client token)
      description: 'What an SDK started with `remoteConfiguration` goes by: any of sessionSampleRate, sessionReplaySampleRate, defaultPrivacyLevel, trackUserInteractions and forwardConsoleLogs. What is left out goes by what the page gave.'
      responses:
        '200': { description: 'The settings' }
        '400': { description: 'The credential is not a client token' }

  /api/v1/rum/histogram:
    get:
      summary: The rows a RUM query matches over time, bar by bar
      description: 'Takes the selection of `search` and counts every matching row. A range holds at most 512 bars. `POST` takes the same names in a JSON body.'
      parameters:
        - { in: query, name: type, required: true, schema: { $ref: '#/components/schemas/RumType' } }
        - { in: query, name: from, schema: { type: integer, format: int64 } }
        - { in: query, name: to, schema: { type: integer, format: int64 } }
        - { in: query, name: filters, schema: { type: string } }
        - { in: query, name: freeText, schema: { type: string } }
        - { in: query, name: bucketTime, schema: { type: integer, format: int64, minimum: 1000 } }
        - { in: query, name: originTime, schema: { type: integer, format: int64 }, description: 'The start of the first bar; `from` when left out, and not after it' }
      responses: { '200': { description: "buckets, each with startTime, total and errors" } }
    post:
      summary: The rows a RUM query matches over time, with the selection in the body
      responses: { '200': { description: 'buckets' } }

  /api/v1/rum/aggregate:
    get:
      summary: Numbers over the rows a RUM query matches, per group and per bar of time
      description: 'Takes the selection of `search` and measures across every matching row: counts, distinct counts, sums, averages, extremes and percentiles, for each group of up to two fields and, with `bucketTime`, for each bar of time. A measure is { fn, field?, fallback?, where?, name? }: `fn` is count, stored, count_distinct, sum, avg, min, max, p50, p75, p90, p95 or p99; `count` without a field counts rows, with one the rows that have it, and `stored` counts the rows that are stored whatever share they were kept with; with `estimate` (the default) counts, sums and averages are those of every session, each row counting for as many as the share it was kept with says (`retention.rate`), and percentiles are weighed by the same shares, while the sessions told by `count_distinct` of session.id are scaled by the mean share of their rows and other distinct values are counted as seen; `fallback` goes with count_distinct and names the field to take where `field` has no value; `where` is a list of filters and limits the measure to the rows that meet them. Views and sessions are counted once, in their latest version. Groups are ranked by the first measure unless `orderBy` names a measure, a group field or `time`; `limit` is the number of groups, at most 250 and, with bars, 20 (every one of them is followed through all the bars). A group with no value is `null`. A value the reader may not see comes back as the text it is masked to. A count that takes too long or finds the system busy answers no rows with `unavailable`. `POST` takes the same names in a JSON body.'
      parameters:
        - { in: query, name: type, required: true, schema: { $ref: '#/components/schemas/RumType' } }
        - { in: query, name: measures, required: true, schema: { type: string }, description: 'JSON list of up to 16 measures; every one has a different name, `fn(field)` or `fn` when none is given' }
        - { in: query, name: groupBy, schema: { type: string }, description: 'JSON list of up to 2 fields; a JSON column cannot be grouped by, but a key of it can, as `feature_flags.<key>`' }
        - { in: query, name: from, schema: { type: integer, format: int64 } }
        - { in: query, name: to, schema: { type: integer, format: int64 } }
        - { in: query, name: filters, schema: { type: string } }
        - { in: query, name: freeText, schema: { type: string } }
        - { in: query, name: bucketTime, schema: { type: integer, format: int64, minimum: 1000 }, description: 'Adds time: one row per group per bar; a range holds at most 512 bars' }
        - { in: query, name: originTime, schema: { type: integer, format: int64 }, description: 'The start of the first bar; `from` when left out, and not after it' }
        - { in: query, name: orderBy, schema: { type: string }, description: 'A measure name, a group field, or `time` (bars, without groups)' }
        - { in: query, name: order, schema: { type: string, enum: [asc, desc] }, description: 'descending for a measure, ascending for a group or time, when left out' }
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 250, default: 10 } }
        - { in: query, name: estimate, schema: { type: boolean, default: true }, description: 'Count what the rows that were kept stand for (the default), or `false` for the rows that are stored' }
      responses: { '200': { description: "groupBy, measures (name, fn, field, unit: count or the unit of the field), rows (group, values and, over time, startTime), bucketTime and originTime over time, and unavailable when there are no numbers" } }
    post:
      summary: Numbers over the rows a RUM query matches, with the request in the body
      responses: { '200': { description: 'groupBy, measures, rows' } }

  /api/v1/rum/playlists:
    get:
      summary: List the playlists of RUM sessions (`streams.query`)
      description: 'A playlist is a named list of the sessions of one application, each with the moment worth opening it at. Answers the playlists without their sessions (id, application, name, description, createdBy, createdAt, updatedAt, sessionCount), the one changed last first.'
      parameters:
        - { in: query, name: application, schema: { type: string }, description: 'Only the playlists of this application' }
      responses: { '200': { description: 'The playlists' } }
    post:
      summary: Make a playlist (`rum.manage`)
      description: 'The body is { application, name, description?, sessions? } with a session being { sessionId, atTime? }. The application has to exist (404); the name is 1 to 128 characters and no other playlist of the application has it, whatever the case (409); a playlist holds at most 500 sessions. Answers the playlist with its sessions.'
      responses:
        '200': { description: 'The playlist with its sessions' }
        '404': { description: 'The application does not exist' }
        '409': { description: 'The application has a playlist of this name' }

  /api/v1/rum/playlists/{id}:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string } }
    get:
      summary: Read a playlist with its sessions, in the order they were added (`streams.query`)
      responses: { '200': { description: 'The playlist with its sessions: sessionId, atTime, addedBy and addedAt each' } }
    patch:
      summary: Change the name or the description of a playlist (`rum.manage`)
      responses: { '200': { description: 'The playlist with its sessions' } }
    delete:
      summary: Delete a playlist (`rum.manage`)
      description: The sessions in it are not touched.
      responses: { '200': { description: 'deleted' } }

  /api/v1/rum/playlists/{id}/sessions:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string } }
    post:
      summary: Put sessions in a playlist (`rum.manage`)
      description: 'The body is { sessions: [{ sessionId, atTime? }] }. A session that is in the playlist takes the moment it is given and keeps its place. A playlist holds at most 500 sessions.'
      responses: { '200': { description: 'The playlist with its sessions' } }

  /api/v1/rum/playlists/{id}/sessions/{sessionId}:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string } }
      - { in: path, name: sessionId, required: true, schema: { type: string } }
    delete:
      summary: Take a session out of a playlist (`rum.manage`)
      description: A session that is not in the playlist is not an error.
      responses: { '200': { description: 'The playlist with its sessions' } }

  /api/v1/rum/sessions/{id}/playlists:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string } }
    get:
      summary: The playlists a session is in (`streams.query`)
      responses: { '200': { description: 'The playlists, without their sessions' } }

  /api/v1/rum/analytics/funnel:
    get:
      summary: The sessions that got through a series of steps in order (`streams.query`)
      description: 'A step is { type: views or actions, name?, filters }: a page or screen that was opened, or something a person did, narrowed by filters as in `search`. A session counts for the first step by its first row that meets it, and for each step after by its first row that meets it later than the row of the step before, in the same session. Answers { groups: [{ value, steps: [{ name, sessions, conversion, fromPrevious, medianMs }] }], from, to }; a group is the funnel of the sessions with one value of `breakdown` (the 10 with the most sessions), `value` being null for all of them together. A count that takes too long or finds the system busy answers no figures with `unavailable`. `POST` takes the same names in a JSON body.'
      parameters:
        - { in: query, name: steps, required: true, schema: { type: string }, description: 'JSON list of 2 to 8 steps' }
        - { in: query, name: filters, schema: { type: string }, description: 'JSON list of what every step has to meet, usually the application and the environment' }
        - { in: query, name: from, schema: { type: integer, format: int64 }, description: 'Microseconds; the last 7 days when left out' }
        - { in: query, name: to, schema: { type: integer, format: int64 } }
        - { in: query, name: windowSecs, schema: { type: integer, minimum: 1 }, description: 'The longest from the first step to a later one' }
        - { in: query, name: breakdown, schema: { type: string }, description: 'A text field of the rows of the first step' }
      responses:
        '200': { description: "groups (value, steps), from, to and unavailable when there are no numbers" }
        '400': { description: 'Fewer than 2 or more than 8 steps, a window that is not positive, a field that is not text or that the type does not have' }
    post:
      summary: The funnel of a series of steps, with the request in the body
      responses: { '200': { description: 'groups, from, to' } }

  /api/v1/rum/analytics/paths:
    get:
      summary: The pages sessions opened after a page, or before it (`streams.query`)
      description: 'Pages are taken in the order a session opened them, a page opened again at once counting once, and told by `by`. Without `anchor` the paths start at the first page of each session (end at the last, with `backward`). Answers { columns (depth + 1, the page the paths are of being column 0, the last going back), sessions, backward, nodes: [{ column, page, sessions, ends }], links: [{ column, source, target, sessions }], from, to }; a column names the 8 pages with the most sessions and puts the rest together as `__other__`. A count that takes too long or finds the system busy answers no figures with `unavailable`. `POST` takes the same names in a JSON body.'
      parameters:
        - { in: query, name: anchor, schema: { type: string }, description: 'The page the paths start from, or end at going back' }
        - { in: query, name: backward, schema: { type: boolean, default: false } }
        - { in: query, name: depth, schema: { type: integer, minimum: 1, maximum: 6, default: 3 }, description: 'How many pages after (before) the anchor' }
        - { in: query, name: by, schema: { type: string, enum: [view.url_path_group, view.url_path, view.name], default: view.url_path_group } }
        - { in: query, name: filters, schema: { type: string } }
        - { in: query, name: from, schema: { type: integer, format: int64 }, description: 'Microseconds; the last 7 days when left out' }
        - { in: query, name: to, schema: { type: integer, format: int64 } }
      responses:
        '200': { description: "columns, sessions, backward, nodes, links, from, to and unavailable when there are no numbers" }
        '400': { description: 'A depth outside 1 to 6, or a field that does not tell a page' }
    post:
      summary: The paths from a page, with the request in the body
      responses: { '200': { description: 'columns, nodes, links' } }

  /api/v1/rum/analytics/retention:
    get:
      summary: How many of the people first seen in a period were seen again in the periods after (`streams.query`)
      description: 'A person is the `usr.id` of a session, or where it has none its `usr.anonymous_id`; a period is a day of UTC, or a week of UTC that begins on Monday. A person is first seen in the range asked for. Answers { period, periods, cohorts: [{ startTime, users, returned: [count or null] }], from, to }: `returned` has, for each period after the first, how many of the cohort were seen then, and null for a period that has not ended by `to`. Without a range the history is twice `periods` periods back from now, and at least 14 days (8 weeks by week). A count that takes too long or finds the system busy answers no cohorts with `unavailable`. `POST` takes the same names in a JSON body.'
      parameters:
        - { in: query, name: period, schema: { type: string, enum: [day, week], default: day } }
        - { in: query, name: periods, schema: { type: integer, minimum: 1, maximum: 30, default: 7 } }
        - { in: query, name: filters, schema: { type: string } }
        - { in: query, name: from, schema: { type: integer, format: int64 } }
        - { in: query, name: to, schema: { type: integer, format: int64 } }
      responses:
        '200': { description: "period, periods, cohorts, from, to and unavailable when there are no numbers" }
        '400': { description: 'Periods outside 1 to 30' }
    post:
      summary: The retention of the people of a period, with the request in the body
      responses: { '200': { description: 'period, periods, cohorts' } }

  /api/v1/rum/alerts/preview:
    post:
      summary: What an alert rule on a RUM figure would have seen over the last stretch of time (`streams.query`)
      description: 'Reads the figure of `query` window by window, by the code that evaluates the rule. The body is { query: { applicationId, metric, environment?, page?, version?, minSamples? }, periodSecs, from?, to? }: `metric` is session_count, view_count, error_count, error_rate, crash_free_sessions, frustration_rate, failed_request_rate, lcp_p75, inp_p75, cls_p75, ttfb_p75, new_issues or regressed_issues; `page` is refused for the figures of sessions and issues, `version` for the figures of issues, and `minSamples` for a count; `periodSecs` is the window, from 60 to 21600, and a point is one window. The range is in microseconds, read in whole windows ending at `to` (now when left out); `from` defaults to six hours before `to`, held between 12 and 72 windows and within a day, and a range holds at most 360 windows. A window that holds fewer rows than `minSamples` has no value. A read that takes too long or finds the system busy answers no points with `unavailable`.'
      responses:
        '200': { description: "metric, unit (count, percent, milliseconds or score), minSamples, periodSecs, from, to, points (at, value, samples), current (the last point), and unavailable (time_budget or busy)" }
        '400': { description: 'A rule that does not fit its figure, a window outside 60 to 21600 seconds, or a range of more than 360 windows' }
        '404': { description: 'The application does not exist' }

  /api/v1/rum/issues:
    get:
      summary: The issues the errors of a RUM application are grouped into, with the numbers of a range
      description: 'An issue is what the errors that are alike are one thing of; its id is in `error.issue_id`. The list is of the issues with errors in the range: the numbers (`sessions`, `users`, `occurrences`, and a `trend` of up to 12 equal parts of the range) are counted from the errors, the state and the history are kept apart. The 250 issues with the most sessions (or users, or occurrences, by `sort`) are read and narrowed by `status`, `assignee`, `team`, `search` and `fresh`; at most `limit` are answered, and `total` is how many the filters leave. A count that takes too long or finds the system busy answers no issues with `unavailable`.'
      parameters:
        - { in: query, name: application, required: true, schema: { type: string } }
        - { in: query, name: env, schema: { type: string }, description: 'Only the errors of this environment' }
        - { in: query, name: source, schema: { type: string }, description: 'Only the errors sent by this source: browser, flutter, ...' }
        - { in: query, name: filters, schema: { type: string }, description: 'JSON list of more conditions on the errors counted, as in /rum/search' }
        - { in: query, name: from, schema: { type: integer, format: int64 } }
        - { in: query, name: to, schema: { type: integer, format: int64 } }
        - { in: query, name: status, schema: { type: string, default: unresolved }, description: 'unresolved (open, investigating and regressed), all, or one of open, investigating, regressed, resolved, ignored' }
        - { in: query, name: assignee, schema: { type: string }, description: 'A user id, or `none`' }
        - { in: query, name: team, schema: { type: string }, description: 'A team id, or `none`' }
        - { in: query, name: search, schema: { type: string }, description: 'Words found, ignoring case, in the type, the message or the place' }
        - { in: query, name: fresh, schema: { type: boolean }, description: 'Only the issues first seen in the range, or regressed in it' }
        - { in: query, name: sort, schema: { type: string, enum: [sessions, users, occurrences, last_seen, first_seen, status], default: sessions } }
        - { in: query, name: order, schema: { type: string, enum: [asc, desc] }, description: 'descending, but for `status`, when left out' }
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
      responses: { '200': { description: "issues (id, applicationId, status, assigneeId, teamId, overflow, source, errorType, message, location, firstSeenAt, lastSeenAt, firstVersion, lastVersion, resolvedAt, resolvedVersion, resolvedBy, regressedAt, regressedVersion, regressedEnvironment, updatedBy, updatedAt, sessions, users, occurrences, trend), total, and unavailable" } }

  /api/v1/rum/issues/{id}:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string } }
    get:
      summary: One RUM issue, with its numbers in a range, its latest sessions and its stack
      description: 'The issue as the list has it, without a trend, with `sessions`, `users` and `occurrences` counted over `from` and `to`; `samples`, the last three sessions that met it (timestamp, sessionId, userId, anonymousId, page, browser, system, version, hasReplay, retained: false for an error of a session that was not kept, which has no session to open); and `stack`, of the latest error that has frames: message, text, frames (raw, restored, inApp), symbolication (completed, partial, missing), handling, isCrash and category.'
      parameters:
        - { in: query, name: from, schema: { type: integer, format: int64 } }
        - { in: query, name: to, schema: { type: integer, format: int64 } }
      responses:
        '200': { description: 'The issue' }
        '404': { description: 'No issue has this id' }
    patch:
      summary: Set the state, the team or the person of a RUM issue (`rum.manage`)
      description: 'A body of any of `status` (open, investigating, resolved or ignored; regressed is set by the rules and answers 400), `assigneeId` and `teamId` (a member of the organization or one of its teams; `null` or an empty text takes it off). What is left out stays. Resolving records the time, the person and the newest version of the application, and a new state ends the record of an earlier resolving or regression. The change is audited as `rum.issue.update`.'
      responses:
        '200': { description: 'The issue after the change' }
        '400': { description: 'Nothing to change, a state a person cannot set, or a person or a team of another organization' }
        '404': { description: 'No issue has this id' }

  /api/v1/rum/{type}/{id}:
    get:
      summary: One row of a RUM type with all its columns
      description: '`id` is the value of the `idField` of the type. `from` and `to` narrow where to look; without them the lookup covers the last 30 days.'
      parameters:
        - { in: path, name: type, required: true, schema: { $ref: '#/components/schemas/RumType' } }
        - { in: path, name: id, required: true, schema: { type: string } }
        - { in: query, name: from, schema: { type: integer, format: int64 } }
        - { in: query, name: to, schema: { type: integer, format: int64 } }
      responses:
        '200': { description: 'The row' }
        '404': { description: 'No row has this id in the range' }

  /api/v1/rum/sessions/{id}/timeline:
    get:
      summary: Everything a session did, in order
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      responses: { '200': { description: "session, items (view, action, error, resource, long_task and vital rows, oldest first) and truncated" } }

  /api/v1/rum/sessions/{id}/related-traces:
    get:
      summary: Backend traces of a session
      description: 'The traces whose ID a request of the session carried (`direct`); when there are none, the traces that ran while the session did (`time-correlated`).'
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      responses: { '200': { description: "primaryService and traces, each with traceId, service, spanCount, durationMs, startedAt and relation" } }

  /api/v1/rum/traces/{traceId}/session:
    get:
      summary: The session whose request carried a backend trace ID
      parameters:
        - { in: path, name: traceId, required: true, schema: { type: string } }
      responses: { '200': { description: 'The session, or null' } }

  /api/v1/rum/replay:
    post:
      summary: Send a replay segment (`rum.write`)
      description: 'The body is { application?, sessionId, seq, events, env?, service?, version? } and accepts no other field; env, service and version tell the retention filters of the application what the session is like, so that a segment of a session that is not kept is not stored. `events` are rrweb events. A client token writes to its own application; an application that does not exist answers 404.'
      responses: { '200': { description: 'The stored segment: id, seq, eventCount and hasFullSnapshot' } }

  /api/v1/rum/replay/{sessionId}:
    get:
      summary: Read ordered replay segments for a RUM session
      parameters:
        - { in: path, name: sessionId, required: true, schema: { type: string } }
      responses: { '200': { description: 'sessionId, segmentCount and the events of all segments in order' } }

  /api/v1/metrics/catalog:
    get:
      summary: Cursor-paginated metric catalog
      parameters:
        - { in: query, name: q, schema: { type: string } }
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
        - { in: query, name: cursor, schema: { type: string } }
      responses: { '200': { description: "items, previousCursor, nextCursor, and hasMore" } }

  /api/v1/web/traces:
    get:
      summary: Cursor-paginated Trace summaries
      description: Defaults to the frozen last 24 hours, latest first, 20 rows per page. The list reads the write-time one-row-per-Trace summary projection and never falls back to span aggregation.
      parameters:
        - { in: query, name: from, schema: { type: integer, format: int64 } }
        - { in: query, name: to, schema: { type: integer, format: int64 } }
        - { in: query, name: sort, schema: { type: string, enum: [latest, earliest, duration_desc, duration_asc, span_count_desc, errors_desc] } }
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
        - { in: query, name: cursor, schema: { type: string } }
      responses: { '200': { description: "items, previousCursor, nextCursor, and hasMore" } }

  /api/v1/web/traces/histogram:
    get:
      summary: Count of the Traces a list query matches, per time bucket
      description: Takes the `from`, `to`, `q`, and `filters` of the Trace list and matches the same Traces, counted by start time into the buckets the caller names. Traces with an error span are counted apart. Reads the summary projection, and the spans when a filter is on a span field. Answers `unavailable` (`time_budget`, `busy`, or `scan_limit`) with no buckets when the count cannot be had.
      parameters:
        - { in: query, name: from, required: true, schema: { type: integer, format: int64 } }
        - { in: query, name: to, required: true, schema: { type: integer, format: int64 } }
        - { in: query, name: q, schema: { type: string } }
        - { in: query, name: filters, schema: { type: string } }
        - { in: query, name: bucketTime, required: true, schema: { type: integer, format: int64, minimum: 1000 } }
        - { in: query, name: originTime, required: true, schema: { type: integer, format: int64 } }
      responses: { '200': { description: "bucketTime, originTime, buckets (startTime, total, errors), split, and unavailable when there are no counts" } }

  /api/v1/web/logs:
    post:
      summary: Cursor-paginated structured log search
      description: The first request supplies a stream, absolute time range, and filters; continuations use the signed cursor.
      responses: { '200': { description: "items, previousCursor, nextCursor, and hasMore" } }

  /api/v1/web/logs/histogram:
    post:
      summary: Count of the log rows a structured search matches, per time bucket
      description: Takes the stream, absolute time range, filters, and free text of the first list request, plus `bucketTime` and `originTime`, and counts the rows the list pages through. Rows at level `ERROR` are counted apart unless the level field is masked. Runs as a tracked query. Answers `unavailable` (`time_budget`, `busy`, or `timestamp_masked`) with no buckets when the count cannot be had.
      responses: { '200': { description: "bucketTime, originTime, buckets (startTime, total, errors), split, and unavailable when there are no counts" } }

  /api/v1/web/logs/field-stats:
    post:
      summary: What one field holds across the log rows a structured search matches
      description: Takes the stream, absolute time range, filters, and free text of the first list request, plus `field`, and reads that field in every row the list pages through. Answers how many rows match, how many have a value, how many different values there are (`distinctExact` says whether that was counted or estimated), the ten commonest values, and how the five commonest are spread over time (`trend`, absent when no value repeats or time is masked); for a number also its range, average, quartiles (estimated), standard deviations, skewness, excess kurtosis, and the values counted into bars of a round width; for a timestamp its earliest and latest. An empty string counts as no value. Runs as up to four tracked queries. Answers `unavailable` (`time_budget`, `busy`, or `field_protected` for a masked or encrypted field) when the field cannot be read. A JSON field is refused.
      responses: { '200': { description: "kind (number, time, text, bool), total, present, distinct, distinctExact, range (min, max as text), spread (avg, q1, median, q3, stddevSamp, stddevPop, skewness, kurtosis), bars (origin, width, counts), top (value, count), topSkipped, trend (originTime, bucketTime, series of value and counts), and unavailable when there is no analysis" } }

  /api/v1/web/traces/field-stats:
    post:
      summary: What one Span field holds across the Spans of listed Traces
      description: Takes `traceIds` (at most one page of the Trace list), the time range they lie in, `field`, and optionally the `stream` they were listed from, and reads the field in every Span of those Traces. The answer has the shape of `/api/v1/web/logs/field-stats`, with `total` counting Spans.
      responses: { '200': { description: "kind, total, present, distinct, distinctExact, range, spread, bars, top, topSkipped, trend, and unavailable when there is no analysis" } }

  /api/v1/logs/inspections:
    get:
      summary: List the organization's scheduled log inspections
      description: >-
        An inspection has Mole Agent read one logs stream on a schedule, with read-only tools, and
        keeps the report of every run. Reading them takes `agent.use` and `streams.query`.
      responses:
        '200':
          description: The inspections, by name
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/LogInspection' } }
    post:
      summary: Save a scheduled log inspection
      description: >-
        Takes `inspections.manage`. The caller becomes the user every run reads the logs as, so a
        caller that is an API token is refused (403). The stream must be a logs stream, the model
        provider usable and every notify route on a connector of the organization that takes its
        target; otherwise 400. A name already in use, or an organization that already holds as
        many inspections as the instance allows, is 409.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LogInspectionInput' }
      responses:
        '200':
          description: The inspection as saved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LogInspection' }
  /api/v1/logs/inspections/limits:
    get:
      summary: What the instance allows of scheduled log inspections
      responses: { '200': { description: "minIntervalSecs, maxPerOrg, runTimeoutSecs, and reportRetentionDays" } }
  /api/v1/logs/inspections/{id}:
    get:
      summary: Read a scheduled log inspection
      responses:
        '200':
          description: The inspection
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LogInspection' }
    put:
      summary: Replace a scheduled log inspection
      description: >-
        Takes the whole `LogInspectionInput` under the rules of saving a new one. The caller becomes
        the user it runs as from then on. Its next run stays where it was unless the schedule, the
        time zone or `enabled` changed.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LogInspectionInput' }
      responses:
        '200':
          description: The inspection as saved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LogInspection' }
    delete:
      summary: Delete a scheduled log inspection together with the reports of its runs
      responses: { '200': { description: "deleted: true" } }
  /api/v1/logs/inspections/{id}/enabled:
    post:
      summary: Switch a scheduled log inspection on or off
      description: >-
        Takes an object with `enabled`. Switching it on sets its next run from the schedule;
        switching it off clears it. Who it runs as does not change.
      responses:
        '200':
          description: The inspection
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LogInspection' }
  /api/v1/logs/inspections/{id}/run:
    post:
      summary: Run a scheduled log inspection once, now
      description: >-
        Queues a `manual` run that a node running inspections picks up within seconds; it reads the
        logs as the user the inspection runs as, and `requestedBy` keeps who asked. 409 while a
        run of the inspection waits or is under way.
      responses:
        '200':
          description: The queued run
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LogInspectionRun' }
  /api/v1/logs/inspections/{id}/runs:
    get:
      summary: The runs of a scheduled log inspection, newest first
      parameters:
        - { in: query, name: limit, schema: { type: integer, default: 50, minimum: 1, maximum: 200 } }
        - { in: query, name: before, schema: { type: integer, format: int64 }, description: Only runs created before this time in epoch micros }
      responses:
        '200':
          description: The runs, each without its report
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/LogInspectionRun' } }
  /api/v1/logs/inspections/{id}/runs/{runId}:
    get:
      summary: One run of a scheduled log inspection, with its report
      responses:
        '200':
          description: The run
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LogInspectionRun' }

  /api/v1/agent/telemetry/stats:
    get: { summary: "Mole Agent model calls in a time range: calls, tokens, cost (null when no call was priced) and average latency" }
  /api/v1/agent/telemetry/top-models:
    get: { summary: Top models by call count }
  /api/v1/agent/telemetry/top-users:
    get: { summary: "Top users by call count (the person who asked in a chat, the run-as user of a log inspection); calls of root cause analysis and LLM functions are left out" }
  /api/v1/agent/usage:
    get:
      summary: "The organization's Mole Agent token usage today against its daily budget, and usage per UTC day and source"
      parameters:
        - { name: days, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 90, default: 30 } }
  /api/v1/agent/usage/budget:
    put:
      summary: "Set the organization's daily token limit and what chats and on-demand analyses do once it is used up"
      description: "Requires `agent.manage`. `dailyTokenLimit` null follows the instance default (`[agent] daily_token_budget`), 0 is unlimited. `interactiveMode` is `block` or `warn`; background calls always stop at the limit."
  /api/v1/agent/feedback:
    get:
      summary: "The current user's ratings of the given chat answers or incident root cause analyses"
      parameters:
        - { name: targetKind, in: query, required: true, schema: { type: string, enum: [chat_message, incident_rca] } }
        - { name: targetIds, in: query, required: false, description: "Comma-separated, at most 200", schema: { type: string } }
    put:
      summary: Rate a chat answer or an incident root cause analysis, one rating per person and object
      description: "`rating` is `up` or `down`; `reasons` (only kept for `down`) from `wrong_conclusion`, `missed_cause`, `unusable_advice`, `off_topic`, `other`; `comment` up to 2000 characters. A chat answer needs `chatId` and can only be rated by the person who asked."
  /api/v1/agent/feedback/{targetKind}/{targetId}:
    delete:
      summary: "Withdraw the current user's rating"
      parameters:
        - { name: targetKind, in: path, required: true, schema: { type: string, enum: [chat_message, incident_rca] } }
        - { name: targetId, in: path, required: true, schema: { type: string } }
        - { name: chatId, in: query, required: false, description: "The chat of a chat answer, so it is scored again without the rating", schema: { type: string } }
  /api/v1/agent/chat:
    get: { summary: "The current user's personal chats and the team chats of the teams they are in, newest first; each says `scope` (`personal` or `team`), `teamId` and whether it is `readable`" }
    post:
      summary: Create a Mole Agent chat
      description: "`teamId` makes it a team chat: the team's members and `agent.manage` holders read and continue it, and it loads the organization's and that team's skills and MCP servers. Without it the chat is personal and only its owner reads it. The scope cannot change once the chat exists."
  /api/v1/agent/chat/{id}:
    get: { summary: "Get one chat the reader can read, including the chat of an automation run, which is not listed (`automationId`)" }
    delete: { summary: Archive and soft-delete a chat }
  /api/v1/agent/chat/{id}/messages:
    get: { summary: "List chat messages; a user message that was a slash command carries `command` (name, args, source) beside the text as typed" }
    post:
      summary: Send or regenerate a message with context, Agent Profile, Prompt, and execution policy; stream Mole Agent events over SSE
      description: "A message that starts with `/name` is a slash command: `/query`, `/dashboard` and `/rca <incident>` change the mode, time range and question of that round; other built-in commands are carried out by the client. Any other name is a skill the chat can use (`/name@team` names a team's skill and, in a personal chat, brings that team in), and `/<server>:<prompt> arguments` runs an MCP server's prompt with the sender's own credential. A refused command answers 400, 403, 404, 409 or 502 with `code` (`unknown_command`, `client_command`, `command_argument_missing`, `command_unavailable`, `command_target_not_found`, `command_ambiguous` with the `options` to write instead, `command_needs_runner`, `command_needs_credential`, `command_failed`) and `command`, and nothing is kept. `\\/` at the start sends the slash as text."
  /api/v1/agent/commands:
    get:
      summary: "The slash commands of the chat for the current user: name, kind (control or task), source (`builtin`, `skill`, `mcp`), description and argument hint in the reader's language, choices, where argument suggestions come from, the `team` of a team skill or the `server` of an MCP prompt, and whether the command is available"
      parameters:
        - { name: chatId, in: query, required: false, description: "Commands of this chat: its skills and MCP prompts follow its scope", schema: { type: string } }
        - { name: teamId, in: query, required: false, description: "For a chat not started yet that will be for this team; neither means a personal chat", schema: { type: string } }
  /api/v1/agent/chat/{id}/archive:
    post: { summary: Archive the chat transcript to object storage }
  /api/v1/agent/dashboard-authoring/capabilities:
    get:
      summary: Discover the server-owned Dashboard authoring contract, visualizations, query kinds, limits, and workflow
      description: Requires `agent.use`, `dashboards.create`. The response is derived from the deployed compiler manifest.
  /api/v1/agent/dashboard-drafts/{id}:
    get:
      summary: Read an organization-scoped persisted Dashboard draft for restricted preview
      description: Returns the server-compiled model, hash, expiry, preflight results, and current operation state. Cross-organization lookup is non-enumerating.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
  /api/v1/agent/dashboard-drafts/{id}/propose:
    post:
      summary: Propose controlled creation of a previously prepared Dashboard draft
      description: Accepts only the expected draft hash plus human-readable reason and impact. It never accepts a compiled model or trusted identity fields and never creates a Dashboard directly.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expectedHash, reason, impact]
              properties:
                expectedHash: { type: string, pattern: '^[a-f0-9]{64}$' }
                reason: { type: string, minLength: 1, maxLength: 2000 }
                impact: { type: string, minLength: 1, maxLength: 2000 }
  /api/v1/agent/overview:
    get: { summary: Mole Agent operational overview }
  /api/v1/agent/investigations:
    get: { summary: List investigation tasks }
    post: { summary: Create an investigation task }
  /api/v1/agent/investigations/{id}:
    get: { summary: Get investigation steps, evidence, and hypotheses }
    put: { summary: Update investigation state and conclusion }
  /api/v1/agent/investigations/{id}/steps:
    post: { summary: Append a traceable investigation step }
  /api/v1/agent/investigations/{id}/evidence:
    post: { summary: Append evidence with fact status and source reference }
  /api/v1/agent/investigations/{id}/hypotheses:
    post: { summary: Create or update a root-cause hypothesis }
  /api/v1/agent/automations:
    get: { summary: "List the automations the reader can see, each with its last run, and whether the reader can create one" }
    post: { summary: "Create an automation: name, task (`prompt`), scope (`org`, `team` with `teamId`, `personal`), trigger (`schedule` with a five-field `cron` and `timezone`, `incident` with filters, `api`, `manual`), outputs (notify channels, `writeRca`) and time limit; needs agent.automations.manage, and it runs as the person who saves it" }
  /api/v1/agent/automations/{id}:
    get: { summary: Get an automation }
    put: { summary: "Update an automation; its scope stays, and the person who saves it becomes the one it runs as" }
    delete: { summary: Delete an automation and its run history }
  /api/v1/agent/automations/{id}/enabled:
    post: { summary: "Switch an automation on or off (`enabled`)" }
  /api/v1/agent/automations/{id}/run:
    post: { summary: "Run an automation now, at most once a minute; answers 202 with the run (`skipped` or `failed` with `reason` when it could not start)" }
  /api/v1/agent/automations/{id}/token:
    post: { summary: "Make or replace the API token of an automation started by API calls; the token is returned once" }
    delete: { summary: Take the API token away }
  /api/v1/agent/automations/{id}/runs:
    get: { summary: "The last runs of an automation, newest first: status (`running`, `succeeded`, `partial`, `failed`, `skipped`, `blocked`, `abandoned`), reason codes, the chat of the run, and the notices and RCA it wrote" }
  /api/v1/agent/automation-templates:
    get: { summary: "The built-in automation templates in the reader's language; scheduled ones in `timezone`" }
  /api/v1/public/automations/{id}/trigger:
    post:
      summary: "Start an automation from an outside system such as a CI/CD job"
      description: "Authenticated with the automation's own token (`Authorization: Bearer mspat-…`), not a user token. The optional body `{\"text\": \"…\"}` (at most 8000 characters) is the context of the run, read as data. Answers 202 with `runId`, `status` and `chatUrl`; 401 for a wrong token or an unknown automation, 409 when it is off or not started by API calls, 429 within 10 seconds of the previous start."
  /api/v1/agent/quality/overview:
    get:
      summary: "The quality of Mole Agent's answers over a period: answers scored, the mean rules and evaluator scores, ratings, reviews waiting, the score by UTC day, each rule dimension, and groups by source, prompt version, Skill and model; prompt names and evaluators to read them by; `agent.manage`"
      parameters:
        - { name: days, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 90, default: 30 } }
        - { name: source, in: query, required: false, schema: { type: string, enum: [personal_chat, team_chat, automation, incident_rca] } }
  /api/v1/agent/quality/answers:
    get:
      summary: "Scored answers, newest first, each with its source, the start of its question and answer, what it came from, and every score (`rules` with its dimensions, and each evaluator's with its reason); personal chats are left out; `agent.manage`"
      parameters:
        - { name: days, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 90, default: 30 } }
        - { name: source, in: query, required: false, schema: { type: string, enum: [team_chat, automation, incident_rca] } }
        - { name: below, in: query, required: false, description: "Only answers whose score (the evaluators' mean, else the rules score) is below it, 0 to 1", schema: { type: number } }
        - { name: beforeAt, in: query, required: false, description: "With `beforeId`, the `next` cursor of the previous page", schema: { type: integer } }
        - { name: beforeId, in: query, required: false, schema: { type: string } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
  /api/v1/agent/quality/answers/{kind}/{id}:
    get: { summary: "One scored answer (`chat_answer` with the message ID, `incident_rca` with the incident ID): its scores, its review, and the whole question and answer with the tools its run called; `agent.manage`" }
  /api/v1/agent/quality/reviews:
    get:
      summary: "Answers waiting for review, accepted or rejected, newest first: cause (`low_score`, `thumbs_down`, `sampled`), the score when it came, the reviewer's note, and the answer it is about; `agent.manage`"
      parameters:
        - { name: status, in: query, required: false, schema: { type: string, enum: [pending, accepted, rejected, all], default: pending } }
  /api/v1/agent/quality/reviews/{id}/decision:
    post: { summary: "Accept (the answer is wrong; it joins the regression set prompt checks answer again) or reject a review, with a note of up to 2000 characters: `{\"status\": \"accepted\" | \"rejected\", \"note\": \"…\"}`; `agent.manage`" }
  /api/v1/agent/quality/evaluators:
    get: { summary: "The organization's evaluators; `agent.manage`" }
    post: { summary: "Add an evaluator: `name`, `rubric` (up to 4000 characters), `targets` (`team_chat`, `automation`, `incident_rca`), `samplePercent`, optional `providerId` and `model`, `temperature` (0 to 1), `enabled`; at most 10 per organization, and it writes its reasons in the saver's interface language; `agent.manage`" }
  /api/v1/agent/quality/evaluators/{id}:
    put: { summary: "Change an evaluator; `agent.manage`" }
    delete: { summary: "Delete an evaluator; its scores stay and its queued scorings are dropped; `agent.manage`" }
  /api/v1/agent/quality/settings:
    get: { summary: "The organization's scoring settings: `reviewThreshold` (0 to 1, default 0.6), `reviewSamplePercent`, and `gate` (`off`, `warn`, `block`) for setting organization prompts as the default; `agent.manage`" }
    put: { summary: "Change the scoring settings; `agent.manage`" }
  /api/v1/agent/im/bots:
    get: { summary: "The connectors that can answer in IM, Feishu (`lark_app`), Slack (`slack_app`), DingTalk (`dingtalk_app`), WeCom smart bot (`wecom_bot`), Google Chat (`google_chat_app`), and Microsoft Teams (`teams_app`): whether each is `enabled`, the `defaultTeamId` new group threads go to, the `missing` settings it still needs, the `status` of its connection (`idle`, `connecting`, `connected`, `error`) with `statusDetail`, and for Teams the `callbackUrl` to enter as the Azure Bot's messaging endpoint (null while `http.external_url` is not https); `externalUrl` says whether people can link their accounts themselves; `agent.manage`" }
  /api/v1/agent/im/bots/{connectorId}:
    put: { summary: "Turn answering in IM on or off for a connector and choose the team new group threads go to: `{\"enabled\": true, \"defaultTeamId\": \"…\" | null}`; a connector missing a setting it needs (such as a Slack app-level token or a Google Chat Pub/Sub subscription) cannot be turned on, nor a Teams connector while `http.external_url` is not https; `agent.manage`" }
    delete: { summary: "Stop answering in IM with the connector and drop its threads and messages; `agent.manage`" }
  /api/v1/public/im/teams/{connector_id}/messages:
    post:
      summary: "Where Bot Framework posts the activities of a Microsoft Teams bot that answers as Mole Agent"
      description: "Not a MoleSignal sign-in: every request must carry a JWT Bot Framework signed (`Authorization: Bearer …`), checked against the OpenID metadata of `login.botframework.com` for its signature, `iss` (`https://api.botframework.com`), `aud` (the bot's App ID), `exp` and `nbf` (five minutes of skew), a signing key that endorses the activity's `channelId`, and a `serviceUrl` equal to the activity's. Answers 200 at once and handles Teams (`msteams`) messages in the background; 401 for a missing or invalid token, 403 for an unendorsed channel, a `serviceUrl` mismatch, or a service URL outside Bot Framework, 404 when the connector is not a Teams connector answering in IM, 413 for a body over 256 KiB."
  /api/v1/agent/im/links/{token}:
    get: { summary: "The IM account a one-time link sent in IM would link: `platform`, `connectorName`, `externalIdentity`, `displayName`, and `expiresAt`; 404 once it is used or expired" }
    post: { summary: "Link the IM account to the caller as a verified notification method of the connector; works once, within 15 minutes; 409 when the account is already linked to another user" }

  /api/v1/me/ui-preference/{scope}/{key}:
    get:
      summary: How the signed-in user prefers a page to look, by purpose and key
      description: >-
        A preference about the interface that belongs to one user in the organization they are signed in to,
        such as the columns a log stream is listed in. `scope` names the purpose and `key` what it
        is kept for. The known scope is `logs.columns`, keyed by the stream's name; its value is an
        object with `fields`, the names of the fields beside the time in their order (at most 64,
        none twice). Any other scope is refused. No permission is asked, since the preference is the
        caller's own and nobody else can read it.
      responses: { '200': { description: "value (null where nothing is kept) and updated_at_micros (null with it)" } }
    put:
      summary: Keep an interface preference for the signed-in user
      description: >-
        Takes an object with `value` in the shape of the scope and keeps it in place of what was
        kept before. A value of another shape, or larger than 16 KiB written out, is refused. A
        user keeps at most 200 keys per scope in an organization; past that the least recently
        written are dropped.
      responses: { '200': { description: "value as kept and updated_at_micros" } }
    delete:
      summary: Forget an interface preference, so the page shows its default again
      responses: { '204': { description: "Nothing is kept under the key any more" } }

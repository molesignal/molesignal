  /api/v1/query:
    post:
      summary: Execute SQL or PromQL query
      parameters:
        - in: header
          name: Accept
          description: '`application/x-ndjson` 走 streaming（bypass query_result cache）'
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [orgId, language, statement, timeRange]
              properties:
                orgId: { type: string }
                language: { type: string, enum: [sql, promql] }
                statement: { type: string }
                timeRange:
                  type: object
                  properties:
                    start: { type: integer }
                    end: { type: integer }
                stream:
                  type: object
                  properties:
                    name: { type: string }
                    streamType: { type: string, enum: [logs, metrics, traces, enrichment] }
                limit: { type: integer }
      responses:
        '200':
          description: query result (rows + columns + scannedRows + tookMs)


# MoleSignal HTTP API v1
# OpenAPI 3.0 描述。当前覆盖 intake / query / streams / alerts / dashboards / 派生查询 /
# 付费版 (sso/clusters/cipher_keys/connectors/agent)。
# 完整 endpoint 索引见各 handler 文件 `src/api/http/routes/*.rs`。

openapi: 3.0.3
info:
  title: MoleSignal API
  version: 1.0.0
  description: |
    MoleSignal 是可观测平台核心引擎。所有 endpoint 默认走 `Authorization: Bearer <jwt>` 鉴权；
    `/api/v1/healthz` / `/api/v1/auth/signin` / `/api/v1/auth/sso/*` / `/metrics`
    在白名单内免鉴权。

    错误统一返 `{ "error": "<message>" }` body；状态码：
    - 400 invalid argument
    - 401 unauthorized (token 校验失败)
    - 403 forbidden (IAM permission 不足)
    - 404 not found / 跨 org lookup
    - 409 conflict (unique 约束 / 状态冲突)
    - 501 profiling kind unavailable on this build
    - 413 payload too large
    - 429 rate limited

    精确流名 `_molesignal` 保留给服务自身遥测。所有公共 intake 与 stream mutation
    对该名称返回 403；`_sys` system scope 中的 IAM 查询仍然可用。
servers:
  - url: https://molesignal.example.com
  - url: http://localhost:5080

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    SignInIdentity:
      type: object
      description: Who signed in. The session itself is in the cookies.
      properties:
        userId: { type: string }
        email: { type: string }
        displayName: { type: string }
        orgId: { type: string }
        orgName: { type: string }
        displayRole: { type: string }
        scope: { type: string }
        roles:
          type: array
          items:
            type: object
            required: [id, key, name, builtin]
            properties:
              id: { type: string }
              key: { type: string }
              name: { type: string }
              builtin: { type: boolean }
    MfaRequired:
      type: object
      description: The second step a sign-in waits for.
      required: [challenge, methods, expiresAt]
      properties:
        challenge: { type: string }
        methods:
          type: array
          items: { type: string, enum: [totp, passkey, recovery_code] }
        expiresAt: { type: integer, format: int64 }
    MfaEnrollRequired:
      type: object
      description: A second factor to set up before the sign-in gets a session.
      required: [challenge, methods, organizationName, expiresAt]
      properties:
        challenge: { type: string }
        methods:
          type: array
          items: { type: string, enum: [passkey, totp] }
        organizationName: { type: string, description: The organization that requires it }
        expiresAt: { type: integer, format: int64 }
    EnrolledSignIn:
      type: object
      properties:
        login: { $ref: '#/components/schemas/SignInIdentity' }
        recoveryCodes:
          type: array
          items: { type: string }
          description: Shown this once
    SigninPolicy:
      type: object
      required: [requireMfa, ssoOnly]
      properties:
        requireMfa: { type: boolean, description: Sessions entering need multi-factor authentication }
        ssoOnly: { type: boolean, description: Only the organization's own single sign-on enters; root is the exception }
    FactorProof:
      description: A second factor, named by `method`.
      oneOf:
        - type: object
          required: [method, code]
          properties:
            method: { type: string, enum: [totp, recovery_code] }
            code: { type: string }
        - type: object
          required: [method, ceremony, credential]
          properties:
            method: { type: string, enum: [passkey] }
            ceremony: { type: string, description: From a passkey check; works once }
            credential: { type: object, description: 'The browser''s answer, binary fields in base64url' }
    AddingProof:
      description: What confirms adding a second factor; see `addingRequires` of `/api/v1/me/mfa`.
      oneOf:
        - { $ref: '#/components/schemas/FactorProof' }
        - type: object
          required: [method, password]
          properties:
            method: { type: string, enum: [password] }
            password: { type: string, format: password }
    PasskeyCeremony:
      type: object
      description: One passkey operation. `ceremony` comes back with the browser's answer and works once.
      required: [ceremony, options]
      properties:
        ceremony: { type: string }
        options: { type: object, description: 'For the browser''s WebAuthn call, binary fields in base64url' }
    Passkey:
      type: object
      required: [id, name, createdAt]
      properties:
        id: { type: string }
        name: { type: string, description: Empty when it has no name of its own }
        aaguid: { type: string, nullable: true, description: 'The authenticator''s model in hex, when the browser reports it' }
        createdAt: { type: integer, format: int64 }
        lastUsedAt: { type: integer, format: int64, nullable: true }
    Error:
      type: object
      properties:
        error: { type: string }
    IntakeResult:
      type: object
      properties:
        accepted: { type: integer }
        rejected: { type: integer }
        errors:
          type: array
          items:
            type: object
            properties:
              index: { type: integer }
              reason: { type: string }
    RumType:
      type: string
      enum: [sessions, views, actions, errors, resources, long_tasks, vitals, logs]
      description: The kind of row a RUM endpoint works on. Each type is the stream of the same name with the `rum_` prefix.
    SearchJob:
      type: object
      required: [jobId, state, kind, attempt, userId, submittedAt, expiresAt]
      properties:
        jobId: { type: string }
        state: { type: string, enum: [pending, running, done, failed, cancelled] }
        kind:
          type: string
          enum: [query, backfill]
          description: '`backfill` is a job a data pipeline submitted to backfill a time range; `pipelineId` names that pipeline'
        pipelineId: { type: string, nullable: true }
        attempt: { type: integer, description: Execution generation, one higher after every retry }
        userId: { type: string, description: The user who submitted the job }
        submittedBy:
          type: object
          nullable: true
          description: Display name and email of that user; null once the user record is gone
          properties:
            displayName: { type: string }
            email: { type: string }
        request:
          type: object
          nullable: true
          description: The query the job runs, as it was submitted; null when the stored request cannot be decoded
          properties:
            language: { type: string, enum: [sql, promql] }
            statement: { type: string }
            timeRange:
              type: object
              properties:
                start: { type: integer, format: int64, description: epoch micros }
                end: { type: integer, format: int64, description: epoch micros }
            stream:
              type: object
              nullable: true
              properties:
                name: { type: string }
                streamType: { type: string }
            limit: { type: integer, nullable: true }
        submittedAt: { type: integer, format: int64 }
        startedAt: { type: integer, format: int64, nullable: true }
        finishedAt: { type: integer, format: int64, nullable: true }
        resultObjectKey:
          type: string
          nullable: true
          description: 'Object key of the NDJSON result of a `done` job: `search_jobs/v1/{org}/{job_id}-{attempt}.ndjson`'
        resultRows: { type: integer, format: int64, nullable: true }
        error: { type: string, nullable: true, description: Why a `failed` job failed }
        expiresAt:
          type: integer
          format: int64
          description: After this time the job and its result object are removed
    LogInspectionInput:
      type: object
      required: [name, stream, windowSecs, schedule, timezone, providerId, language]
      properties:
        name: { type: string, maxLength: 120, description: Unique within the organization }
        stream: { type: string, description: A logs stream of the organization; a run reads no other stream }
        statement:
          type: string
          maxLength: 8000
          description: The condition the inspected logs match, as the Logs page writes a query; empty inspects the whole stream
        windowSecs:
          type: integer
          format: int64
          minimum: 300
          maximum: 604800
          description: How much time before the moment of a run the run looks over
        requirements: { type: string, maxLength: 2000, description: What the model is asked to attend to }
        schedule: { $ref: '#/components/schemas/LogInspectionSchedule' }
        timezone: { type: string, description: 'IANA time zone the time of day of a `daily` or `weekly` schedule is read in, e.g. `Asia/Shanghai`' }
        providerId: { type: string, description: 'An AI model provider of the organization that is enabled and has a key' }
        model: { type: string, nullable: true, description: A model of that provider to use in place of its default }
        notifyWhen:
          type: string
          enum: [abnormal, attention, always]
          default: abnormal
          description: '`abnormal` tells of reports at level `abnormal` or `unknown`, `attention` also of `attention`, `always` of every report'
        notifyRoutes:
          type: array
          maxItems: 10
          description: Where a notification is sent; none repeats. Without any, nothing is sent and the reports are still kept
          items: { $ref: '#/components/schemas/LogInspectionNotifyRoute' }
        language: { type: string, enum: [en-us, zh-cn], description: The language of the reports and of the notifications }
        enabled: { type: boolean, default: true, description: Whether it runs on its schedule; a disabled inspection can still be run by hand }
    LogInspectionSchedule:
      description: How often an inspection runs. No schedule may run more often than the instance allows (`minIntervalSecs` of the limits).
      oneOf:
        - type: object
          required: [type, everyMinutes]
          properties:
            type: { type: string, enum: [interval] }
            everyMinutes: { type: integer, minimum: 1 }
        - type: object
          required: [type, hour, minute]
          properties:
            type: { type: string, enum: [daily] }
            hour: { type: integer, minimum: 0, maximum: 23 }
            minute: { type: integer, minimum: 0, maximum: 59 }
        - type: object
          required: [type, weekday, hour, minute]
          properties:
            type: { type: string, enum: [weekly] }
            weekday: { type: integer, minimum: 1, maximum: 7, description: 1 is Monday and 7 is Sunday }
            hour: { type: integer, minimum: 0, maximum: 23 }
            minute: { type: integer, minimum: 0, maximum: 59 }
    LogInspectionNotifyRoute:
      type: object
      required: [connectorId, targetType, target]
      properties:
        connectorId: { type: string, description: A Notify connector of the organization }
        targetType: { type: string, enum: [fixed_group, fixed_address] }
        target: { type: string, maxLength: 512, description: The group or address on that connector, as the connector takes it }
    LogInspection:
      description: A saved inspection. It carries every field of `LogInspectionInput` as saved, and what the server keeps beside them.
      allOf:
        - $ref: '#/components/schemas/LogInspectionInput'
        - type: object
          required: [id, runAsUserId, createdBy, createdAt, updatedAt]
          properties:
            id: { type: string }
            runAsUserId: { type: string, description: The user every run reads the logs as; whoever saved the inspection last }
            runAsUser:
              type: object
              nullable: true
              description: Name and email of that user; null once the user record is gone
              properties:
                id: { type: string }
                displayName: { type: string }
                email: { type: string }
            nextRunAt: { type: integer, format: int64, nullable: true, description: Null while the inspection is disabled }
            lastRun:
              type: object
              nullable: true
              description: How the run that ended last went; null before the first has ended
              properties:
                atTime: { type: integer, format: int64 }
                status: { type: string, enum: [succeeded, failed, timed_out] }
                level: { type: string, enum: [normal, attention, abnormal, unknown], nullable: true }
            activeRun:
              type: object
              nullable: true
              description: The run that waits or is under way; an inspection has at most one
              properties:
                id: { type: string }
                status: { type: string, enum: [queued, running] }
                trigger: { type: string, enum: [schedule, manual] }
                createdAt: { type: integer, format: int64 }
                startedAt: { type: integer, format: int64, nullable: true }
            createdBy: { type: string }
            createdAt: { type: integer, format: int64 }
            updatedAt: { type: integer, format: int64 }
    LogInspectionRun:
      type: object
      required: [id, inspectionId, trigger, status, windowStart, windowEnd, createdAt]
      properties:
        id: { type: string }
        inspectionId: { type: string }
        trigger: { type: string, enum: [schedule, manual] }
        status: { type: string, enum: [queued, running, succeeded, failed, timed_out] }
        level:
          type: string
          enum: [normal, attention, abnormal, unknown]
          nullable: true
          description: 'The verdict of the report of a `succeeded` run; `unknown` when the model stated none'
        windowStart: { type: integer, format: int64 }
        windowEnd: { type: integer, format: int64 }
        summary: { type: string, nullable: true, description: The summary of the report, as notifications quote it }
        report: { type: string, nullable: true, description: What the model wrote; always null in a list of runs }
        failure:
          type: string
          nullable: true
          enum: [timed_out, interrupted, not_started, identity, model, agent, internal]
          description: >-
            Why a run left no report: it exceeded its time limit, the node running it stopped, no node
            picked it up, the user it runs as can no longer be used, the model is missing, disabled or
            without a key, the call to the model failed, or an internal cause
        error: { type: string, nullable: true, description: Technical detail of the failure }
        providerId: { type: string, nullable: true }
        model: { type: string, nullable: true, description: The model that was called }
        runAsUserId: { type: string, nullable: true }
        requestedBy: { type: string, nullable: true, description: 'The user who asked for a `manual` run' }
        requestedByUser:
          type: object
          nullable: true
          properties:
            id: { type: string }
            displayName: { type: string }
            email: { type: string }
        toolCalls:
          type: array
          description: The tools the model called, in order
          items:
            type: object
            properties:
              name: { type: string }
              ok: { type: boolean }
        promptTokens: { type: integer, format: int64 }
        completionTokens: { type: integer, format: int64 }
        notifications:
          type: array
          description: Whom the run told, one entry per channel
          items:
            type: object
            properties:
              connectorId: { type: string }
              targetType: { type: string, enum: [fixed_group, fixed_address] }
              targetMasked: { type: string }
              delivered: { type: boolean }
              error: { type: string, nullable: true }
        createdAt: { type: integer, format: int64 }
        startedAt: { type: integer, format: int64, nullable: true }
        finishedAt: { type: integer, format: int64, nullable: true }
    ApmResponseMeta:
      type: object
      required: [range, resolution, dataQuality, activationBoundary]
      properties:
        range:
          type: object
          properties:
            from: { type: integer, format: int64, description: epoch micros }
            to: { type: integer, format: int64, description: epoch micros }
        resolution: { type: string, enum: [minute, hour] }
        projectionStartedAt: { type: integer, format: int64, nullable: true }
        lastCompleteBucketAt: { type: integer, format: int64, nullable: true }
        activationBoundary: { type: boolean }
        dataQuality:
          type: object
          required: [partial, gaps, overflowDimensions]
          properties:
            partial: { type: boolean }
            gaps: { type: array, items: { type: object } }
            overflowDimensions: { type: array, items: { type: string } }

security:
  - bearerAuth: []

paths:
  /api/v1/healthz:
    get:
      summary: Liveness + readiness probe
      security: []
      responses:
        '200': { description: ready }
        '503': { description: degraded (intake replay / object_store probe failing) }

  /metrics:
    get:
      summary: Prometheus exposition
      security: []
      responses:
        '200':
          description: text/plain; version=0.0.4
          content:
            text/plain: {}

  /api/v1/iam/permissions:
    get:
      summary: Read the database-backed IAM permission catalog
      description: Requires `iam.roles.read` or `iam.policies.read`.
      responses:
        '200': { description: Versioned permissions, role mappings, relation mappings, and bundles }
        '403': { description: Missing IAM catalog read permission }

  /api/v1/iam/capabilities:
    get:
      summary: Resolve capabilities for the signed active organization
      responses:
        '200': { description: Organization, scope, display role, permissions, features, policy version, and database-resolved route/navigation decisions }

  /api/v1/iam/share-targets:
    get:
      summary: List non-system organizations eligible as explicit share targets
      description: Requires `iam.policies.manage`.
      responses:
        '200': { description: Sorted organization id/name options }

  /api/v1/iam/role-bindings:
    get: { summary: List IAM role bindings }
    post: { summary: Create a validated organization/resource role binding }
  /api/v1/iam/role-bindings/{id}:
    delete:
      summary: Delete an IAM role binding and increment the policy version
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }

  /api/v1/iam/relationships:
    get: { summary: List direct IAM resource relationships }
    post: { summary: Create a bounded direct resource relationship }
  /api/v1/iam/relationships/{id}:
    delete:
      summary: Delete an IAM resource relationship
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }

  /api/v1/iam/cross-org-grants:
    get: { summary: List incoming and outgoing explicit cross-organization grants }
    post: { summary: Create a non-transitive pending cross-organization grant }
  /api/v1/iam/cross-org-grants/{id}/accept:
    post:
      summary: Accept a pending grant from its target organization
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
  /api/v1/iam/cross-org-grants/{id}/revoke:
    post:
      summary: Revoke a grant from its source or target organization
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }

  /api/v1/iam/evaluate-batch:
    post:
      summary: Evaluate up to 100 ordered IAM permission/resource requests
      responses:
        '200': { description: Ordered IAM decisions with reasons and matched ids }
        '400': { description: Unknown permission, invalid target, or oversized batch }

  /api/v1/system/platform-admins:
    get:
      summary: Read the configured root platform-administrator assignment
      description: Requires a system-scoped JWT with sys.administrators.manage. The assignment is reconciled at startup and cannot be granted or revoked through the API.
      responses:
        '200': { description: The single active root assignment }
        '404': { description: Hidden from tenant scope }

  /api/v1/system/telemetry:
    get:
      summary: Read effective distributed Trace policy and detailed health
      description: |
        Requires SystemTelemetryRead in system scope. Includes deployment/runtime precedence,
        tail-sampler/router/sink metrics, and fixed exporter/capacity/drop/system-load alerts.
      responses:
        '200': { description: Effective policy and non-fatal detailed health }
        '404': { description: Hidden from tenant scope }
    put:
      summary: Atomically publish a runtime Trace policy
      description: |
        Requires SystemTelemetryManage. Static endpoint, protocol, TLS/mTLS, authentication,
        compression, and Resource identity remain deployment configuration.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200': { description: Newly active policy }
        '400': { description: Invalid bounded policy }
        '404': { description: Hidden from tenant scope }

  /api/v1/system/telemetry/policies:
    get:
      summary: List immutable Trace policy history
      responses:
        '200': { description: Version history with active marker }
        '404': { description: Hidden from tenant scope }

  /api/v1/system/telemetry/debug-tokens:
    get:
      summary: List Trace debug-token metadata
      description: Plaintext token values are never returned after issuance.
      responses:
        '200': { description: Token metadata }
        '404': { description: Hidden from tenant scope }
    post:
      summary: Issue a bounded one-time-visible Trace debug token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ttlSeconds]
              properties:
                organizationId: { type: string, nullable: true }
                routePattern: { type: string, nullable: true }
                ttlSeconds: { type: integer, minimum: 1, maximum: 3600 }
                maxUses: { type: integer, minimum: 1, maximum: 10000, default: 100 }
      responses:
        '201': { description: Metadata plus the plaintext token exactly once }
        '404': { description: Hidden from tenant scope }

  /api/v1/system/telemetry/debug-tokens/{id}:
    delete:
      summary: Revoke a Trace debug token
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '204': { description: Revoked }
        '404': { description: Hidden or token not found }

  /api/v1/auth/signin:
    post:
      summary: Email + password login
      description: |
        Sets the session cookies and answers `{"login": …}`. An account with multi-factor
        authentication gets no cookies yet: the answer is `{"mfa": …}`, finished with
        `/api/v1/auth/signin/verify`. Where the organization requires it and the account has no
        second factor, the answer is `{"enroll": …}`, set up under `/api/v1/auth/signin/enroll`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string }
                password: { type: string }
                remember: { type: boolean, description: Keep the session after the browser closes }
      responses:
        '200':
          description: The session, or the second step it waits for
          content:
            application/json:
              schema:
                type: object
                properties:
                  login: { $ref: '#/components/schemas/SignInIdentity' }
                  mfa: { $ref: '#/components/schemas/MfaRequired' }
                  enroll: { $ref: '#/components/schemas/MfaEnrollRequired' }
        '401': { $ref: '#/components/schemas/Error' }
        '403': { description: The only organizations of this account only allow single sign-on }
        '429': { description: The account's second step is locked after too many wrong codes }

  /api/v1/auth/signin/verify:
    post:
      summary: Finish a sign-in with its second step
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - type: object
                  required: [challenge]
                  properties:
                    challenge: { type: string, description: From the `mfa` answer }
                - { $ref: '#/components/schemas/FactorProof' }
      responses:
        '200':
          description: Session cookies are set
          content:
            application/json:
              schema:
                type: object
                properties:
                  login: { $ref: '#/components/schemas/SignInIdentity' }
                  recoveryCodesLeft:
                    type: integer
                    nullable: true
                    description: How many are left, after signing in with a recovery code
        '400': { description: The passkey check expired; ask for a new one }
        '401': { description: 'Wrong code or passkey, or the sign-in expired' }
        '429': { description: Locked after too many wrong codes }

  /api/v1/auth/signin/verify/passkey:
    post:
      summary: A passkey check for the second step of a sign-in
      description: Only the account's own credentials are allowed.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [challenge]
              properties:
                challenge: { type: string }
      responses:
        '200':
          description: Options for `navigator.credentials.get()`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PasskeyCeremony' }
        '400': { description: 'Passkeys are not available on this instance, or the account has none' }
        '401': { description: The sign-in expired }

  /api/v1/auth/signin/passkey/options:
    post:
      summary: Start signing in with a passkey, without a password
      security: []
      responses:
        '200':
          description: Options for `navigator.credentials.get()`, with no allowed credentials
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PasskeyCeremony' }
        '400': { description: '`http.external_url` cannot be a passkey''s relying party' }

  /api/v1/auth/signin/passkey:
    post:
      summary: Finish signing in with a passkey
      description: The passkey requires user verification, so this counts as multi-factor authentication.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ceremony, credential]
              properties:
                ceremony: { type: string }
                credential: { type: object, description: 'The browser''s answer, binary fields in base64url' }
                remember: { type: boolean }
      responses:
        '200':
          description: Session cookies are set
          content:
            application/json:
              schema:
                type: object
                properties:
                  login: { $ref: '#/components/schemas/SignInIdentity' }
        '400': { description: The passkey request expired; start again }
        '401': { description: 'The passkey is not registered here, or could not be verified' }

  /api/v1/auth/signin/enroll/totp:
    post:
      summary: Start setting up an authenticator during a sign-in that asks for a second factor
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [challenge]
              properties:
                challenge: { type: string, description: From the `enroll` answer }
      responses:
        '200':
          description: The new key
          content:
            application/json:
              schema:
                type: object
                properties:
                  setup: { type: string, description: Sent back with the first code }
                  secret: { type: string }
                  otpauthUrl: { type: string }
                  qrSvg: { type: string }
                  expiresAt: { type: integer, format: int64 }
        '401': { description: 'The sign-in expired, or the account has a second factor by now' }

  /api/v1/auth/signin/enroll/totp/confirm:
    post:
      summary: Turn the authenticator on with its first code and finish the sign-in
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [challenge, setup, code]
              properties:
                challenge: { type: string }
                setup: { type: string }
                code: { type: string }
      responses:
        '200':
          description: Session cookies are set
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EnrolledSignIn' }
        '400': { description: 'Wrong code, or the setup expired' }
        '401': { description: 'The sign-in expired, or the account has a second factor by now' }

  /api/v1/auth/signin/enroll/passkey/options:
    post:
      summary: The options for creating a passkey during a sign-in that asks for a second factor
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [challenge]
              properties:
                challenge: { type: string }
      responses:
        '200':
          description: Options for `navigator.credentials.create()`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PasskeyCeremony' }
        '400': { description: '`http.external_url` cannot be a passkey''s relying party' }
        '401': { description: 'The sign-in expired, or the account has a second factor by now' }

  /api/v1/auth/signin/enroll/passkey:
    post:
      summary: Keep the passkey the browser created and finish the sign-in
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [challenge, ceremony, credential]
              properties:
                challenge: { type: string }
                ceremony: { type: string }
                credential: { type: object, description: 'The browser''s answer, binary fields in base64url' }
                name: { type: string, maxLength: 64 }
      responses:
        '200':
          description: Session cookies are set
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EnrolledSignIn' }
        '400': { description: 'The request expired, or the passkey could not be verified' }
        '401': { description: 'The sign-in expired, or the account has a second factor by now' }

  /api/v1/auth/sso/login:
    get:
      summary: Start an OIDC or OAuth 2.0 sign-in
      description: |
        Stores the state, nonce, and optional `next` page, then redirects the browser to the
        identity provider. When the provider cannot be resolved the browser is sent to
        `/signin?sso=<handoff code>` instead, where the reason can be exchanged.
      security: []
      parameters:
        - { in: query, name: providerId, schema: { type: string } }
        - { in: query, name: provider, schema: { type: string }, description: Provider name when only one enabled provider has it }
        - { in: query, name: next, schema: { type: string }, description: Local path to open after sign-in; other values are ignored }
      responses:
        '303': { description: Redirect to the identity provider, or to /signin with a handoff code }

  /api/v1/auth/sso/callback:
    get:
      summary: OIDC and OAuth 2.0 callback
      description: |
        Checks the state, exchanges the code, verifies the ID token (OIDC: RSA, EC, and EdDSA keys
        from the JWKS, or HMAC with the client secret), reads the user endpoint, provisions the
        local membership, and redirects to `/signin?sso=<handoff code>`. Failures redirect the
        same way and are reported by the exchange endpoint.
      security: []
      parameters:
        - { in: query, name: code, schema: { type: string } }
        - { in: query, name: state, schema: { type: string } }
        - { in: query, name: error, schema: { type: string } }
        - { in: query, name: error_description, schema: { type: string } }
      responses:
        '303': { description: 'Redirect to /signin with a single-use handoff code, or, for a test sign-in, to its result page' }

  /api/v1/auth/sso/saml/login:
    get:
      summary: Start a SAML sign-in (HTTP-Redirect binding)
      security: []
      parameters:
        - { in: query, name: providerId, schema: { type: string } }
        - { in: query, name: next, schema: { type: string } }
      responses:
        '303': { description: Redirect to the IdP, or to /signin with a handoff code }

  /api/v1/auth/sso/saml/callback:
    post:
      summary: SAML assertion consumer service
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                SAMLResponse: { type: string }
                RelayState: { type: string }
      responses:
        '303': { description: Redirect to /signin with a single-use handoff code }

  /api/v1/auth/sso/exchange:
    post:
      summary: Exchange a sign-in handoff code for its outcome
      description: |
        Each code is single-use and expires two minutes after the callback. The body is
        `{"login": …}` with the local JWT and organization context, or `{"link": …}` when the
        identity is not bound yet and its email already belongs to an account: the account's owner
        must confirm with `/api/v1/auth/sso/link/confirm`. Either carries the `next` page requested
        at sign-in.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string }
      responses:
        '200':
          description: Signed in
          content:
            application/json:
              schema:
                type: object
                properties:
                  login: { type: object, description: Same body as /api/v1/auth/signin }
                  link:
                    type: object
                    description: Confirmation the account's owner must give before the identity is bound
                    properties:
                      code: { type: string, description: Proves the confirmation comes from the browser that signed in }
                      providerName: { type: string }
                      organizationName: { type: string }
                      emailHint: { type: string }
                      emailAvailable: { type: boolean, description: A verification code can be emailed }
                      passwordAllowed: { type: boolean, description: The account has a password }
                  next: { type: string }
        '401': { description: Code expired or unknown, or the sign-in failed (message says why) }
        '403': { description: The account is outside the provider's allowed groups or email domains }

  /api/v1/auth/sso/providers:
    get:
      summary: List enabled external login providers without secret configuration
      security: []
      responses:
        '200':
          description: Empty in community mode; otherwise enabled OIDC, OAuth 2.0, SAML, and LDAP providers
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [id, name, kind, platform]
                  properties:
                    id: { type: string }
                    name: { type: string }
                    kind: { type: string, enum: [oidc, oauth2, saml, ldap] }
                    platform:
                      type: string
                      description: Preset platform used for the sign-in button icon
                      enum: [custom, google, microsoft, github, gitlab, okta, auth0, keycloak, authentik, feishu, adfs, jumpcloud, active_directory, openldap, freeipa]

  /api/v1/auth/sso/link/email:
    post:
      summary: Email a verification code for a pending identity link
      description: Needs SMTP. One code per account per minute; the code works only with the browser's `code`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string }
                locale: { type: string, description: Language of the email (zh-* or English) }
      responses:
        '200': { description: Code sent }
        '401': { description: The pending link expired }
        '429': { description: A code was sent less than a minute ago }

  /api/v1/auth/sso/link/confirm:
    post:
      summary: Confirm a pending identity link with the emailed code or the account password
      description: |
        Binds the identity to the account and signs in. An emailed code also proves the mailbox,
        so identities created by single sign-on without a proven email are unbound. Five wrong
        attempts end the pending link.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string }
                emailCode: { type: string }
                password: { type: string, format: password }
      responses:
        '200': { description: '`{"login": …}`, as from the exchange' }
        '401': { description: Wrong code or password, or the pending link expired }

  /api/v1/me/sso-identities:
    get:
      summary: List the external identities bound to the signed-in account
      description: Most recently used first.
      responses:
        '200':
          description: Bound identities
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [id, providerId, providerName, kind, platform, orgId, orgName, linkedAt, lastLoginAt, canUnlink]
                  properties:
                    id: { type: string }
                    providerId: { type: string }
                    providerName: { type: string }
                    kind: { type: string, enum: [oidc, oauth2, saml, ldap] }
                    platform: { type: string }
                    orgId: { type: string }
                    orgName: { type: string }
                    linkedAt: { type: integer, format: int64 }
                    lastLoginAt: { type: integer, format: int64 }
                    canUnlink:
                      type: boolean
                      description: False for the last identity of an account without a password

  /api/v1/me/sso-identities/{id}:
    delete:
      summary: Unbind one external identity from the signed-in account
      description: Refused for the last identity of an account without a password, and for API tokens.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '204': { description: Unbound }
        '400': { description: The account would be left without a way to sign in }
        '404': { description: No such identity on this account }

  /api/v1/me/mfa:
    get:
      summary: The signed-in account's multi-factor authentication
      responses:
        '200':
          description: Its second factors, and what adding another one asks for
          content:
            application/json:
              schema:
                type: object
                required: [totpEnabled, recoveryCodesLeft, passkeys, addingRequires, requiredBy]
                properties:
                  totpEnabled: { type: boolean }
                  totpEnabledAt: { type: integer, format: int64, nullable: true }
                  recoveryCodesLeft: { type: integer }
                  passkeys:
                    type: array
                    items: { $ref: '#/components/schemas/Passkey' }
                  passkeysUnavailable:
                    type: string
                    nullable: true
                    enum: [not_configured, ip_address, not_https]
                    description: Why `http.external_url` cannot be a passkey's relying party
                  addingRequires:
                    type: string
                    enum: [factor, password, nothing, sign_in_again]
                    description: |
                      An existing second factor; the account password; nothing (no password, and
                      signed in within 10 minutes); or a fresh sign-in (no password, signed in earlier).
                  requiredBy:
                    type: array
                    items: { type: string }
                    description: The account's organizations that require it; the last second factor has to stay

  /api/v1/me/mfa/totp/setup:
    post:
      summary: Start setting up an authenticator app
      description: Browser sessions only. The first code from it is sent to `/api/v1/me/mfa/totp/confirm`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                proof: { $ref: '#/components/schemas/AddingProof' }
      responses:
        '200':
          description: The new key
          content:
            application/json:
              schema:
                type: object
                properties:
                  setup: { type: string, description: Sent back with the first code }
                  secret: { type: string, description: 'For typing in by hand, in groups of four' }
                  otpauthUrl: { type: string }
                  qrSvg: { type: string }
                  expiresAt: { type: integer, format: int64 }
        '400': { description: The proof is missing or wrong }
        '429': { description: Locked after too many wrong codes }

  /api/v1/me/mfa/totp/confirm:
    post:
      summary: Turn the authenticator on with its first code
      description: |
        Ends the account's other sign-ins when this turns multi-factor authentication on or replaces
        an authenticator; this browser gets a reconfirmed session.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [setup, code]
              properties:
                setup: { type: string }
                code: { type: string }
      responses:
        '200':
          description: Turned on
          content:
            application/json:
              schema:
                type: object
                properties:
                  recoveryCodes:
                    type: array
                    nullable: true
                    items: { type: string }
                    description: When this turned multi-factor authentication on; shown this once
        '400': { description: 'Wrong code, or the setup expired' }

  /api/v1/me/mfa/totp/disable:
    post:
      summary: Remove the authenticator
      description: Ends the account's other sign-ins. Multi-factor authentication stays on while a passkey is left.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FactorProof' }
      responses:
        '204': { description: Removed }
        '400': { description: 'Not turned on, or the proof is wrong' }
        '429': { description: Locked after too many wrong codes }

  /api/v1/me/mfa/recovery-codes:
    post:
      summary: Replace the recovery codes
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FactorProof' }
      responses:
        '200':
          description: The new codes, shown this once
          content:
            application/json:
              schema:
                type: object
                properties:
                  recoveryCodes:
                    type: array
                    items: { type: string }
        '400': { description: 'Multi-factor authentication is off, or the proof is wrong' }
        '429': { description: Locked after too many wrong codes }

  /api/v1/me/mfa/passkey-proof:
    post:
      summary: A passkey check that confirms a change to the account's second factors
      responses:
        '200':
          description: Options for `navigator.credentials.get()`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PasskeyCeremony' }
        '400': { description: 'Passkeys are not available on this instance, or the account has none' }

  /api/v1/me/passkeys/options:
    post:
      summary: Start adding a passkey
      description: Browser sessions only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                proof: { $ref: '#/components/schemas/AddingProof' }
      responses:
        '200':
          description: |
            Options for `navigator.credentials.create()`: a discoverable credential with user
            verification, any kind of authenticator, no attestation.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PasskeyCeremony' }
        '400': { description: 'Passkeys are not available on this instance, or the proof is missing or wrong' }
        '429': { description: Locked after too many wrong codes }

  /api/v1/me/passkeys:
    post:
      summary: Keep the passkey the browser created
      description: |
        The account's first second factor turns multi-factor authentication on and ends its other
        sign-ins; this browser gets a reconfirmed session.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ceremony, credential]
              properties:
                ceremony: { type: string }
                credential: { type: object, description: 'The browser''s answer, binary fields in base64url' }
                name: { type: string, maxLength: 64 }
      responses:
        '200':
          description: Added
          content:
            application/json:
              schema:
                type: object
                properties:
                  passkey: { $ref: '#/components/schemas/Passkey' }
                  recoveryCodes:
                    type: array
                    nullable: true
                    items: { type: string }
                    description: When this turned multi-factor authentication on; shown this once
        '400': { description: 'The request expired, or the passkey could not be verified' }
        '409': { description: This passkey is already added }

  /api/v1/me/passkeys/{id}:
    patch:
      summary: Rename a passkey
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, maxLength: 64 }
      responses:
        '204': { description: Renamed }
        '404': { description: No such passkey on this account }

  /api/v1/me/passkeys/{id}/remove:
    post:
      summary: Remove a passkey
      description: |
        Ends the account's other sign-ins. Removing the last second factor turns multi-factor
        authentication off, and the recovery codes stop working.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FactorProof' }
      responses:
        '204': { description: Removed }
        '400': { description: The proof is wrong }
        '404': { description: No such passkey on this account }
        '429': { description: Locked after too many wrong codes }

  /api/v1/me/sessions/revoke-others:
    post:
      summary: Sign out every other device
      description: This browser gets a reconfirmed session.
      responses:
        '204': { description: Signed out }

  /api/v1/users/{id}/mfa/reset:
    post:
      summary: Turn off a member's multi-factor authentication
      description: |
        Requires `org.members.manage`. An organization administrator reaches members of that
        organization alone; the platform administrator reaches anyone but the root user.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '204': { description: Reset; the member's sign-ins have ended }
        '403': { description: 'The member also belongs to other organizations, or is the root user' }
        '404': { description: Not a member of this organization }

  /api/v1/settings/signin-policy:
    get:
      summary: What entering the current organization asks of a sign-in
      description: Requires `org.settings.read`; in the platform organization, `sys.settings.manage`.
      responses:
        '200':
          description: The requirements
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SigninPolicy' }
    put:
      summary: Change what entering the current organization asks of a sign-in
      description: |
        Requires `org.settings.manage`; in the platform organization, `sys.settings.manage`. Reaches
        every session within 15 minutes: a session that does not meet it ends at its next renewal.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SigninPolicy' }
      responses:
        '200':
          description: The saved requirements
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SigninPolicy' }
        '400': { description: '`ssoOnly` needs an enabled OIDC, OAuth 2.0 or SAML provider' }

  /api/v1/orgs/{id}/select:
    post:
      summary: Switch the browser session to another organization
      description: |
        Rewrites the session cookies for that organization, or, when its sign-in requirements ask for
        more than this sign-in has, answers what is missing and writes no cookies: `{"mfa": …}`, to
        send the request again with a proof; `{"mfaSetup": …}`, to set up a second factor first; or
        `{"sso": …}`, with the providers to sign in through.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                proof: { $ref: '#/components/schemas/FactorProof' }
      responses:
        '200':
          description: The organization entered, or what entering it still asks for
        '400': { description: The proof is wrong }
        '403': { description: Not a member of this organization }
        '429': { description: Locked after too many wrong codes }

  /api/v1/auth/sso/ldap/login:
    post:
      summary: LDAP search and user simple-bind login
      description: |
        Resolves exactly one user DN with the configured escaped search filter, binds as that
        user over LDAPS or StartTLS, applies the configured identity-field and group-to-role
        mappings, provisions the local membership, and issues a local JWT. Answers `{"login": …}`,
        or `{"link": …}` when the directory identity is not bound and its email already belongs
        to an account (see the exchange endpoint).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [providerId, username, password]
              properties:
                providerId: { type: string }
                username: { type: string, maxLength: 320 }
                password: { type: string, format: password, maxLength: 1024 }
      responses:
        '200': { description: Local JWT and organization context issued }
        '401': { description: Provider, user, or credentials invalid }
        '503': { description: LDAP directory unavailable }

  /api/v1/sso/providers:
    get:
      summary: List organization SSO providers (secrets redacted)
      description: |
        `test` says how each provider's current settings stand with a test sign-in: `untested`,
        `passed`, `failed`, or `stale` (a result on earlier settings), with its `testId`.
    post:
      summary: Create an OIDC, OAuth 2.0, SAML, or LDAP provider
      description: |
        `kind` selects the config block (`oidc`, `oauth2`, `saml`, `ldap`); `platform` names the
        preset (default `custom`) and must support that kind. GitHub and Feishu sign in with
        `oauth2`. Each config accepts `fieldMapping` with `subject`, `email`, `displayName`,
        and `groups` (OIDC and OAuth 2.0 values are claim paths; `a | b` takes the first with a
        value), `groupRoleMapping` (external group value to organization role id), an optional
        `defaultRoleId`, and `allowedGroups` (when set, only members of one of these groups
        can sign in). Every referenced role must belong to the provider organization. A provider
        open to public accounts (Google, github.com, gitlab.com, Microsoft multi-tenant) can only
        be enabled when the organization has email domains or the provider has allowed groups.

  /api/v1/sso/providers/discover:
    post:
      summary: Read an issuer's OpenID Connect discovery document
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [issuer]
              properties:
                issuer: { type: string }
      responses:
        '200': { description: Issuer as published, authorize, token, userinfo, and JWKS URLs, supported scopes }
        '400': { description: Unreachable, not a discovery document, or published for another issuer }

  /api/v1/sso/providers/saml-metadata:
    post:
      summary: Read SAML IdP metadata from a URL or pasted XML
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                url: { type: string }
                xml: { type: string }
      responses:
        '200': { description: IdP entity ID, HTTP-Redirect SSO URL, and signing certificate (PEM) }
        '400': { description: Unreachable, larger than 2 MiB, or no IDPSSODescriptor with an HTTP-Redirect service }

  /api/v1/sso/providers/roles:
    get:
      summary: List organization roles assignable by SSO mappings
      description: Returns only role ids and names and uses the SSO settings read permission.

  /api/v1/sso/providers/{id}:
    get: { summary: Read one organization SSO provider with secrets redacted }
    put:
      summary: Update one provider; omitted secrets retain their saved values
      description: Identity-field and role mappings replace the previously saved mappings.
    delete: { summary: Delete one provider }

  /api/v1/sso/providers/{id}/tests:
    post:
      summary: Start a test sign-in of an OIDC, OAuth 2.0, or SAML provider
      description: |
        Goes through a real sign-in with the saved settings and leaves nothing behind: no session,
        no account, no link, no role change. The browser goes to `authorizationUrl` and comes back
        through the provider's usual callback on `/iam/sso/tests/{test id}`. A disabled provider can
        be tested. Needs `org.settings.manage` and a signed-in session, not an API token.
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        '200':
          description: The test and where the browser goes
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
                  authorizationUrl: { type: string }
        '400': { description: The provider is LDAP, or its settings can't make a sign-in URL }
        '429': { description: More than 10 tests of this provider in a minute }

  /api/v1/sso/providers/{id}/tests/ldap:
    post:
      summary: Test an account against an LDAP provider
      description: |
        A real bind, so a wrong password counts toward the directory's lockout policy and the
        instance's sign-in limits. The password is not stored or logged. Answers with the finished
        test; a refused account is a failed test. Needs `org.settings.manage` and a signed-in session,
        not an API token.
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string }
      responses:
        '200': { description: 'The finished test, as `GET /api/v1/sso/tests/{id}` answers' }
        '400': { description: The provider is not LDAP, or the account or password is empty }
        '429': { description: 'More than 10 tests of this provider in a minute, or too many wrong passwords for this account (`signin_limited`, with `Retry-After`)' }

  /api/v1/sso/tests/{id}:
    get:
      summary: Read one test sign-in
      description: |
        `status` is `pending`, `passed`, `failed`, or `expired` (no answer from the identity provider
        in 10 minutes). `current` is false once the provider's settings have changed since: the result
        no longer counts. `identity` is what the provider returned, `mapping` what a real sign-in would
        do (account, roles), `failure` the class and the message with sensitive values removed, and
        `notes` what a passing test still wants looked at. Needs `org.settings.manage`.
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }

  /api/v1/intake/logs/{stream}:
    post:
      summary: HTTP JSON intake (logs)
      parameters:
        - { in: path, name: stream, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - { type: object }
                - { type: array, items: { type: object } }
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IntakeResult' }
        '413': { description: payload too large }
        '429': { description: rate limited }


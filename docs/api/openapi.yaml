  /api/v1/agent/mcp-servers/{id}/enable-read-only:
    post: { summary: "Turn on every read-only tool (readOnlyHint, risk floor L0) of the server that is still off" }
  /api/v1/agent/mcp-servers/{id}/my-credential:
    put: { summary: "Save the caller's own credential (`value`) for a server with `authType` `member_secret`; only the caller's calls use it" }
    delete: { summary: "Remove the caller's own credential" }

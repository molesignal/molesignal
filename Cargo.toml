[workspace]
resolver = "2"
members = [".", "src/domain/iam/permission_macro", "src/sqlx-shim"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false
rust-version = "1.96"

[workspace.dependencies]


# async runtime
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["full"] }
tokio-stream = "0.1"
async-trait = "0.1"
futures = "0.3"
# Mole Intelligence chat：SSE 解析
eventsource-stream = "0.2"

# http/grpc
axum = { version = "0.8", features = ["macros", "multipart", "tracing"] }
axum-extra = { version = "0.12", features = ["typed-header", "query", "cookie"] }
tower = { version = "0.5", features = ["full"] }
tower-http = { version = "0.6", features = [
    "cors", "compression-gzip", "trace", "timeout", "request-id", "util",
] }
hyper = { version = "1.10", features = ["full"] }
# TLS + ACME（change `domain-acme-tls`）：纯 rustls stack，与 reqwest/sqlx 复用根。
rustls = "0.23"
rustls-pemfile = "2"
tokio-rustls = "0.26"
axum-server = { version = "0.8", features = ["tls-rustls"] }
instant-acme = "0.8"
rcgen = "0.14"
pem = "3"
quick-xml = "0.40"
roxmltree = "0.21"
aws-lc-rs = "1"
sha2 = "0.11"
x509-cert = { version = "0.2", features = ["std", "pem"] }
tonic = { version = "0.14", features = ["gzip", "tls-webpki-roots"] }
tonic-prost = "0.14"
tonic-prost-build = "0.14"
prost = "0.14"
prost-build = "0.14"

# serialization
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
jsonschema = "0.38"
toml = "1.1"

# data / query
arrow = { version = "59", features = ["ipc_compression", "prettyprint"] }
arrow-flight = { version = "59", features = ["flight-sql"] }
arrow-schema = { version = "59", features = ["serde"] }
parquet = { version = "59", features = ["arrow", "async", "object_store"] }
object_store = { version = "0.13", features = ["aws", "azure", "gcp"] }
# Kafka egress connector. cmake-build vendors librdkafka (needs cmake + cc); SSL/GSSAPI
# off to keep the native build minimal (SASL PLAIN works without OpenSSL).
rdkafka = { version = "0.36", default-features = false, features = ["cmake-build", "tokio"] }
# Pinned to a git revision of datafusion's main branch (pre-55) so the whole
# stack can ride arrow/parquet 59. parquet 59 vendors its own thrift internally,
# which drops the external thrift 0.17 dependency together with CVE-2026-43868 /
# GHSA-2f9f-gq7v-9h6m — no local thrift/parquet patching required. Re-pin to the
# datafusion 55.0.0 crates.io release once it ships (also on arrow/parquet 59).
datafusion = { git = "https://github.com/apache/datafusion", rev = "bde8e5b24e772210885ea5272e5cb06b52c939c3" }
sqlparser = { version = "0.62", features = ["serde", "visitor"] }
tantivy = "0.26"
# PromQL parser
promql-parser = "0.9"

# persistence
# 直接用 sqlx，不引 ORM；只支持 postgres。
sqlx = { path = "src/sqlx-shim", features = [
    "runtime-tokio-rustls",
    "postgres",
    "chrono",
    "json",
    "migrate",
] }

# config / cli
figment = { version = "0.10", features = ["toml", "env"] }
clap = { version = "4.6", default-features = false, features = [
    "std", "help", "usage", "suggestions", "cargo", "derive",
] }

# logging / metrics
log = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"
tracing-log = "0.2"
# OTLP receiver：标准 OTLP logs/metrics/traces/profiles。gen-tonic 生成 message struct +
# tonic gRPC service server（对外 OTLP gRPC 接收端用）；with-serde 支持 OTLP/JSON；
# profiles 启用 experimental v1development profiles 类型与 ProfilesService。
opentelemetry-proto = { version = "0.32", default-features = false, features = [
    "gen-tonic",
    "with-serde",
    "logs",
    "metrics",
    "trace",
    "profiles",
] }
prometheus = { version = "0.14", features = ["process"] }

# utilities
anyhow = "1.0"
addr2line = "0.25"
thiserror = "2.0"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
chrono-tz = "0.10"
uuid = { version = "1", features = ["v7", "serde"] }
svix-ksuid = { version = "0.10", features = ["serde"] }
dashmap = { version = "6.2", features = ["serde"] }
parking_lot = "0.12"
once_cell = "1.21"
bytes = "1.11"
itertools = "0.14"
rand = "0.10"
regex = "1.12"
url = "2.5"
ipnet = "2"
hex = "0.4"
md5 = "0.8"
sha256 = "1.6"
argon2 = { version = "0.5", features = ["alloc", "password-hash"] }
jsonwebtoken = { version = "10", default-features = false, features = ["aws_lc_rs"] }
blake3 = "1.8"
base64 = "0.22"

# crypto (cipher keys + license verification)
aes-gcm = { version = "0.10", features = ["std"] }
ed25519-dalek = { version = "2", features = ["std", "pkcs8"] }

# feature-parity M1
sourcemap = "9"
maxminddb = "0.28"
notify = "8"

# VRL transform language（spec pipeline runtime）
# 仅引核心解释器；不需要 vector 的 sink/source。
vrl = { version = "0.33", default-features = false, features = ["compiler", "stdlib", "value"] }

# JS function runtime（feature `js-runtime`，默认关；编译时间膨胀 ~5 分钟）
# 仅 deno_core，不引 deno_runtime，刻意不带 fetch / file IO / npm。
deno_core = "0.403"

# segment WAL
crc32c = "0.6"
lz4_flex = "0.13"
memmap2 = "0.9"

# Prometheus remote_write payload codec
snap = "1"

# tantivy index archive
zstd = "0.13"
tar = "0.4"
flate2 = "1"

# notify senders
reqwest = { version = "0.13", default-features = false, features = [
    # reqwest 0.13 renamed rustls-tls-native-roots → rustls (uses
    # rustls-platform-verifier for OS roots + aws-lc-rs crypto provider)
    # and broke `form` / `multipart` out of default-features.
    "rustls", "json", "stream", "gzip", "form",
] }
lettre = { version = "0.11", default-features = false, features = [
    "builder", "smtp-transport", "pool", "tokio1", "tokio1-rustls-tls",
] }
ldap3 = { version = "0.12.1", default-features = false, features = ["tls-rustls-aws-lc-rs"] }

# cron / scheduling
cron = "0.16"

# in-process caching & rate limiting
moka = { version = "0.12", features = ["future"] }
governor = "0.10"

# templates / Grafana JSON
serde_yaml = "0.9"

# test-only
testcontainers = "0.27"
testcontainers-modules = { version = "0.15", features = ["postgres"] }


[package]
name = "molesignal"
version.workspace = true
edition.workspace = true
publish.workspace = true
rust-version.workspace = true

[lib]
name = "molesignal"
path = "src/lib.rs"

[[bin]]
name = "molesignal"
path = "src/main.rs"

[dependencies]
aes-gcm.workspace = true
addr2line.workspace = true
anyhow.workspace = true
argon2 = { workspace = true, features = ["std"] }
arrow.workspace = true
arrow-flight.workspace = true
arrow-schema.workspace = true
async-trait.workspace = true
aws-lc-rs.workspace = true
axum.workspace = true
axum-extra.workspace = true
axum-server.workspace = true
base64.workspace = true
bitflags = "2"
blake3.workspace = true
bytes.workspace = true
chrono.workspace = true
chrono-tz.workspace = true
clap.workspace = true
crc32c.workspace = true
cron.workspace = true
dashmap.workspace = true
datafusion.workspace = true
deno_core = { workspace = true, optional = true }
ed25519-dalek.workspace = true
eventsource-stream.workspace = true
figment.workspace = true
flate2.workspace = true
futures.workspace = true
governor.workspace = true
hashbrown = "0.17"
headless_chrome = "1"
hex.workspace = true
http = "1"
hyper.workspace = true
instant-acme.workspace = true
jsonschema.workspace = true
jsonwebtoken.workspace = true
ldap3.workspace = true
lettre.workspace = true
log.workspace = true
lz4_flex.workspace = true
maxminddb.workspace = true
memmap2.workspace = true
moka.workspace = true
molesignal-permission-macro = { path = "src/domain/iam/permission_macro" }
notify.workspace = true
object_store.workspace = true
once_cell.workspace = true
opentelemetry-proto.workspace = true
parking_lot.workspace = true
parquet.workspace = true
pem.workspace = true
prometheus.workspace = true
promql-parser.workspace = true
pprof = { version = "0.15", default-features = false, features = ["cpp", "frame-pointer", "prost-codec"], optional = true }
pprof_util = { version = "0.8.2", features = ["symbolize"], optional = true }
prost.workspace = true
quick-xml.workspace = true
rand.workspace = true
rcgen.workspace = true
rdkafka.workspace = true
regex.workspace = true
reqwest.workspace = true
roxmltree.workspace = true
rustls.workspace = true
rustls-pemfile.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
snap.workspace = true
sourcemap.workspace = true
sqlparser.workspace = true
sqlx.workspace = true
svix-ksuid.workspace = true
tantivy.workspace = true
tar.workspace = true
tempfile = "3"
thiserror.workspace = true
tikv-jemalloc-ctl = { version = "0.6", optional = true, features = ["use_std"] }
tikv-jemallocator = { version = "0.6", optional = true, features = ["profiling"] }
tokio.workspace = true
tokio-rustls.workspace = true
tokio-stream.workspace = true
tokio-util.workspace = true
toml.workspace = true
tonic.workspace = true
tonic-prost.workspace = true
tower.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-appender.workspace = true
tracing-log.workspace = true
tracing-subscriber.workspace = true
url.workspace = true
ipnet.workspace = true
uuid.workspace = true
vrl.workspace = true
x509-cert.workspace = true
zstd.workspace = true

[features]
default = ["jemalloc", "profiling-pprof", "ws"]
ws = ["axum/ws"]
enterprise = []
jemalloc = ["dep:tikv-jemallocator", "dep:tikv-jemalloc-ctl"]
profiling-pprof = ["dep:pprof", "dep:pprof_util"]
js-runtime = ["dep:deno_core"]

[dev-dependencies]
criterion = "0.8"
libc = "0.2"
rcgen = "0.14"
testcontainers.workspace = true
testcontainers-modules.workspace = true
tokio-tungstenite = "0.29"
wiremock = "0.6"

[[bench]]
name = "schema_infer"
harness = false

[[bench]]
name = "ingest_hotpath"
harness = false

[profile.release]
debug = 1
strip = false
codegen-units = 1
lto = "thin"

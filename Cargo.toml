[workspace]
resolver = "2"
members = [
    "bin/molesignal",
    "bin/probe-agent",
    "crates/core/*",
    "crates/engines/*",
    "crates/modules/*",
    "crates/transport/*",
    "crates/support/*",
]
default-members = ["bin/molesignal"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false
rust-version = "1.96"

[workspace.dependencies]


# async runtime
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["full"] }
tokio-stream = "0.1"
async-trait = "0.1"
futures = "0.3"
# Mole Agent chat：SSE 解析
eventsource-stream = "0.2"

# http/grpc
axum = { version = "0.8", features = ["macros", "multipart", "tracing"] }
axum-extra = { version = "0.12", features = ["typed-header", "query", "cookie"] }
tower = { version = "0.5", features = ["full"] }
tower-http = { version = "0.6", features = [
    "cors", "compression-gzip", "trace", "timeout", "request-id", "util",
] }
hyper = { version = "1.10", features = ["full"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
rmcp = { version = "3.0.0", default-features = false, features = [
    "server",
    "transport-streamable-http-server",
    "elicitation",
    "request-state",
] }
# TLS + ACME（change `domain-acme-tls`）：纯 rustls stack，与 reqwest/sqlx 复用根。
rustls = "0.23"
rustls-platform-verifier = "0.7"
rustls-pemfile = "2"
russh = "0.62.5"
# Probe Agent: DNS checks of every record type, through a chosen resolver and with DNSSEC, and ICMP ping.
hickory-resolver = { version = "0.26", default-features = false, features = ["system-config", "tokio", "dnssec-aws-lc-rs"] }
surge-ping = "0.9"
# JSONPath (RFC 9535) for synthetic HTTP assertions and extractions.
serde_json_path = "0.7"
# A traceroute to the address a failed synthetic check could not reach.
trippy-core = "0.13"
tokio-rustls = "0.26"
axum-server = { version = "0.8", features = ["tls-rustls"] }
instant-acme = "0.8"
rcgen = { version = "0.14", features = ["x509-parser"] }
pem = "3"
quick-xml = "0.40"
csv = "1"
roxmltree = "0.21"
aws-lc-rs = "1"
sha2 = "0.11"
x509-cert = { version = "0.2", features = ["std", "pem"] }
x509-parser = "0.18"
webpki-roots = "1"
tonic = { version = "0.14", features = ["gzip", "tls-webpki-roots"] }
tonic-prost = "0.14"
tonic-prost-build = "0.14"
prost = "0.14"
tonic-health = "0.14"

# serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jsonschema = "0.38"
toml = "1.1"
# command lines split by shell quoting rules, without a shell
shlex = "1.3"

# data / query
arrow = { version = "59", features = ["ipc_compression", "prettyprint"] }
arrow-flight = { version = "59", features = ["flight-sql"] }
arrow-schema = { version = "59", features = ["serde"] }
parquet = { version = "59", features = ["arrow", "async", "object_store"] }
object_store = { version = "0.13", features = ["aws", "azure", "gcp"] }
# Kafka egress connector. cmake-build vendors librdkafka (needs cmake + cc); ssl-vendored
# builds OpenSSL into it statically (needs perl) for TLS, mTLS and SASL/SCRAM, so no system
# OpenSSL of a particular version is needed where the binary runs. GSSAPI stays off.
rdkafka = { version = "0.36", default-features = false, features = ["cmake-build", "ssl-vendored", "tokio"] }
# datafusion 55 rides arrow/parquet 59. parquet 59 decodes Thrift itself, so the
# tree carries no `thrift` crate (CVE-2026-43868 / GHSA-2f9f-gq7v-9h6m).
datafusion = "55.2"
sqlparser = { version = "0.62", features = ["serde", "visitor"] }
tantivy = "0.26"
# PromQL parser
promql-parser = "0.9"

# persistence
# 直接用 sqlx，不引 ORM；只支持 postgres。
sqlx = { path = "crates/support/sqlx-shim", features = [
    "runtime-tokio-rustls",
    "postgres",
    "chrono",
    "json",
    "migrate",
] }

# config / cli
figment = { version = "0.10", features = ["toml", "env"] }
clap = { version = "4.6", default-features = false, features = [
    "std", "help", "usage", "suggestions", "cargo", "derive",
] }

# logging / metrics
log = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"
tracing-log = "0.2"
# OTLP receiver：标准 OTLP logs/metrics/traces/profiles。gen-tonic 生成 message struct +
# tonic gRPC service server（对外 OTLP gRPC 接收端用）；with-serde 支持 OTLP/JSON；
# profiles 启用 experimental v1development profiles 类型与 ProfilesService。
opentelemetry-proto = { version = "0.32", default-features = false, features = [
    "gen-tonic",
    "with-serde",
    "logs",
    "metrics",
    "trace",
    "profiles",
] }
prometheus = { version = "0.14", features = ["process"] }

# utilities
anyhow = "1.0"
addr2line = "0.25"
thiserror = "2.0"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
chrono-tz = "0.10"
time = "0.3"
uuid = { version = "1", features = ["v7", "serde"] }
svix-ksuid = { version = "0.10", features = ["serde"] }
dashmap = { version = "6.2", features = ["serde"] }
parking_lot = "0.12"
once_cell = "1.21"
bytes = "1.11"
itertools = "0.14"
# 设置身份验证器时扫的二维码，只画 SVG。
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
# Passkey（WebAuthn）的注册与校验。中间状态存进 Postgres，任何节点都能接着验，所以要
# `danger-allow-state-serialisation`；免密码登录要 `conditional-ui`。
webauthn-rs = { version = "0.5.5", features = ["danger-allow-state-serialisation", "conditional-ui"] }
# 注册参数里要改的字段类型（`ResidentKeyRequirement`），版本跟 webauthn-rs 一致。
webauthn-rs-proto = "0.5.5"
# 读 Passkey 注册应答里的验证器型号（AAGUID）；vrl 已经带着它。
ciborium = "0.2.2"
rand = "0.10"
regex = "1.12"
url = "2.5"
percent-encoding = "2.3"
ipnet = "2"
hex = "0.4"
hostname = "0.4"
headless_chrome = "1"
md5 = "0.8"
sha256 = "1.6"
argon2 = { version = "0.5", features = ["alloc", "password-hash"] }
jsonwebtoken = { version = "10", default-features = false, features = ["aws_lc_rs"] }
blake3 = "1.8"
base64 = "0.22"

# crypto (cipher keys and authentication)
aes-gcm = { version = "0.10", features = ["std"] }

# source-map、GeoIP、User-Agent 解析与通知能力
sourcemap = "9"
maxminddb = "0.28"
woothee = "0.13"
notify = "8"

# VRL transform language（spec pipeline runtime）
# 仅引核心解释器；不需要 vector 的 sink/source。
vrl = { version = "0.33", default-features = false, features = ["compiler", "stdlib", "value"] }

# JS function runtime（molesignal 主二进制默认启用；精简构建可显式排除）
# 仅 deno_core，不引 deno_runtime，刻意不带 fetch / file IO / npm。
deno_core = "0.403"

# segment WAL
crc32c = "0.6"
lz4_flex = "0.13"
memmap2 = "0.9"

# Prometheus remote_write payload codec
snap = "1"

# tantivy index archive
zstd = "0.13"
flate2 = "1"

# Mole Agent Skill packages (.zip / .skill / .tar.gz): read only, deflate only
zip = { version = "2.4", default-features = false, features = ["deflate"] }
tar = { version = "0.4", default-features = false }

# notify senders
reqwest = { version = "0.13", default-features = false, features = [
    # reqwest 0.13 renamed rustls-tls-native-roots → rustls (uses
    # rustls-platform-verifier for OS roots + aws-lc-rs crypto provider)
    # and broke `form` / `multipart` out of default-features.
    "rustls", "json", "stream", "gzip", "form",
] }
lettre = { version = "0.11", default-features = false, features = [
    "builder", "smtp-transport", "pool", "tokio1", "tokio1-rustls-tls",
] }
ldap3 = { version = "0.12.1", default-features = false, features = ["tls-rustls-aws-lc-rs"] }
# 邮件告警：读 IMAP 邮箱，解析 MIME（各种字符集都要认，国内邮件常是 GBK）。
async-imap = { version = "0.12", default-features = false, features = ["runtime-tokio"] }
mail-parser = { version = "0.11", features = ["full_encoding"] }

# cron / scheduling
cron = "0.16"

# in-process caching & rate limiting
moka = { version = "0.12", features = ["future", "sync"] }
governor = "0.10"

# templates / Grafana JSON
serde_yaml = "0.9"

# test-only
testcontainers = "0.27"
testcontainers-modules = { version = "0.15", features = ["postgres"] }


[profile.release]
debug = 1
strip = false
codegen-units = 1
lto = "thin"
